<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jigsaw</title>
<meta name="theme-color" content="#6E4B32">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Atkinson Hyperlegible'; font-weight:400; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible'; font-weight:700; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-latin-700-normal.woff2') format('woff2')}
:root{
  --felt:#3E5F4E; --felt-deep:#2F4A3C; --wood:#6E4B32; --wood-hi:#8A6244;
  --ink:#FFF8EC; --chip:#F0E4CC; --chip-ink:#3A2A1C; --glow:#F2C14E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --felt:#2A4236; --felt-deep:#1F332A; --wood:#4A3222; --wood-hi:#624430;
    --ink:#FBF3E4; --chip:#E3D3B4; --chip-ink:#2E2116; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --felt:#2A4236; --felt-deep:#1F332A; --wood:#4A3222; --wood-hi:#624430;
  --ink:#FBF3E4; --chip:#E3D3B4; --chip-ink:#2E2116; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%; margin:0}
body{
  background:var(--felt); color:var(--ink);
  font-family:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header{background:var(--wood); display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 10px}
button,.btn{
  min-height:48px; padding:0 16px; border:0; border-radius:12px;
  background:var(--wood-hi); color:var(--ink); font:inherit; font-size:18px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
}
button:focus-visible,.btn:focus-within{outline:3px solid var(--glow); outline-offset:2px}
button[aria-pressed="true"]{background:var(--chip); color:var(--chip-ink); font-weight:700}
.seg{display:flex; gap:4px}
#openSettings{margin-left:auto}
body[data-mode="puzzle"] .sort-only, body[data-mode="sort"] .puzzle-only{display:none !important}

#stage{position:relative; flex:1; overflow:hidden}
#view{position:absolute; left:0; top:0; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
#zoom{position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px}
#zoom button{width:52px; padding:0; font-size:24px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.35)}
#zoom #zFit{font-size:15px}
#empty{position:absolute; left:16px; right:16px; top:40%; text-align:center; font-size:19px; opacity:.85; display:none; pointer-events:none}
#empty.show{display:block}
#toast{
  position:absolute; left:50%; top:12px; transform:translateX(-50%);
  background:var(--wood); padding:10px 16px; border-radius:12px; font-size:17px;
  box-shadow:0 4px 14px rgba(0,0,0,.35); opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%; text-align:center;
}
#toast.show{opacity:1}
#done{position:absolute; inset:0; display:none; align-items:flex-end; justify-content:center; padding:24px; pointer-events:none}
#done.show{display:flex}
#done div{pointer-events:auto; background:var(--wood); border-radius:16px; padding:16px 20px; display:flex; gap:16px; align-items:center; font-size:22px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.4)}

/* The pile shelf */
#dock{
  background:var(--felt-deep); box-shadow:inset 0 8px 10px -8px rgba(0,0,0,.55);
  display:flex; gap:2px; align-items:flex-end; overflow-x:auto; white-space:nowrap; padding:4px 8px;
}
#dockLabel{font-size:15px; opacity:.9; flex:none; align-self:center; white-space:normal; max-width:7em; line-height:1.2}
#dockLabel[hidden]{display:none}
#chips{display:flex; gap:2px; flex:none; align-items:flex-end}
.heap{background:transparent; flex-direction:column; gap:2px; padding:2px 6px 4px; min-height:0; border-radius:14px; flex:none; transition:transform .15s, background .15s}
.heap .tag{font-size:14px; display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:10px; background:rgba(0,0,0,.25)}
.heap .tag i{width:10px; height:10px; border-radius:50%; flex:none}
.heap .tag b{opacity:.8}
.heap[aria-pressed="true"]{background:transparent; color:var(--ink); font-weight:400}
.heap[aria-pressed="true"] .tag{background:var(--chip); color:var(--chip-ink); font-weight:700}
.heap[aria-pressed="true"] canvas{filter:drop-shadow(0 0 5px var(--glow))}
.heap.target{background:rgba(242,193,78,.28); transform:scale(1.06)}
.heap.pulse{animation:pulse .45s ease-out}
@keyframes pulse{0%{transform:scale(1.12)}100%{transform:scale(1)}}

dialog{border:0; border-radius:18px; padding:0; width:min(520px, calc(100% - 24px)); max-height:85vh; background:var(--wood); color:var(--ink); box-shadow:0 10px 40px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px 20px 20px; overflow:auto; max-height:85vh}
.sheet h2{margin:0 0 8px; font-size:24px}
.sheet h3{margin:20px 0 8px; font-size:18px; opacity:.9}
.sheet p{margin:8px 0; opacity:.85}
.field{margin:12px 0}
.field label{display:flex; justify-content:space-between; gap:12px; font-size:17px}
.field output{font-weight:700; white-space:nowrap}
.field input[type=range]{width:100%; height:36px; accent-color:var(--glow)}
.toggles,.row,.sizes{display:flex; flex-wrap:wrap; gap:6px}
.row{margin-top:20px; justify-content:space-between}
input[type=file]{position:absolute; opacity:0; width:1px; height:1px}
@media (prefers-reduced-motion: reduce){ .heap.pulse{animation:none} #toast{transition:none} }
</style>
</head>
<body data-mode="puzzle">
<header>
  <div class="seg" role="group" aria-label="View">
    <button id="mPuzzle" aria-pressed="true">Puzzle</button>
    <button id="mSort" aria-pressed="false">Sort</button>
  </div>
  <button id="peek" class="puzzle-only" aria-pressed="false">Peek</button>
  <button id="selEdges" class="sort-only">Select edges</button>
  <button id="selNone" class="sort-only">Clear</button>
  <button id="mix" class="sort-only">Mix</button>
  <button id="openSettings">Settings</button>
</header>
<main id="stage">
  <canvas id="view"></canvas>
  <div id="zoom" class="puzzle-only">
    <button id="zIn" aria-label="Zoom in">+</button>
    <button id="zOut" aria-label="Zoom out">−</button>
    <button id="zFit" aria-label="Show the whole table">All</button>
  </div>
  <div id="empty">No loose pieces here.</div>
  <div id="toast" role="status"></div>
  <div id="done"><div><span>You finished it!</span><button id="again">Play again</button></div></div>
</main>
<nav id="dock" aria-label="Piles">
  <span id="dockLabel" hidden></span>
  <div id="chips"></div>
</nav>

<dialog id="settings">
  <div class="sheet">
    <h2>Settings</h2>
    <h3>New puzzle</h3>
    <p id="info"></p>
    <div class="sizes">
      <label class="btn">Choose photo<input id="file" type="file" accept="image/*"></label>
      <button id="sample">Sample picture</button>
    </div>
    <p>Pieces:</p>
    <div class="sizes" id="counts" role="group" aria-label="Number of pieces">
      <button data-n="24">24</button>
      <button data-n="48">48</button>
      <button data-n="100">100</button>
      <button data-n="200">200</button>
      <button data-n="400">400</button>
    </div>
    <h3>Snapping and shape</h3>
    <div id="sliders"></div>
    <h3>Feedback and graphics</h3>
    <div class="toggles" id="toggles"></div>
    <div class="row">
      <button id="reset">Reset settings</button>
      <button id="closeSettings" aria-pressed="true">Done</button>
    </div>
  </div>
</dialog>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* =====================================================================
   1. Settings
   ===================================================================== */

const DEFAULTS = {
  snapFrame: 30, snapJoin: 30, tab: 26, cap: 100, sortSize: 72,
  sound: true, vibrate: true, glow: true, outline: false,
  sharp: !(navigator.deviceMemory && navigator.deviceMemory <= 4),
};
let S = loadSettings();
function loadSettings(){
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('jigsaw-settings') || '{}') }; }
  catch (e) { return { ...DEFAULTS }; }
}
function saveSettings(){ try { localStorage.setItem('jigsaw-settings', JSON.stringify(S)); } catch (e) {} }

const SLIDERS = [
  { k: 'snapFrame', label: 'Snap to the frame', min: 10, max: 60, step: 5, fmt: v => v + '% of a piece' },
  { k: 'snapJoin',  label: 'Snap to other pieces', min: 10, max: 60, step: 5, fmt: v => v + '% of a piece' },
  { k: 'tab',       label: 'Tab size', min: 16, max: 34, step: 2, fmt: v => v + '% of a piece', apply: () => { rebuildGraphics(); afterChange(); } },
  { k: 'cap',       label: 'Pieces out of the box at once', min: 30, max: 200, step: 10, fmt: v => v + ' pieces', apply: () => { computeTable(); afterChange(); } },
  { k: 'sortSize',  label: 'Piece size in Sort view', min: 40, max: 140, step: 4, fmt: v => v + ' px', apply: () => { if (mode === 'sort') enterSort(); } },
];
const TOGGLES = [
  { k: 'sound', label: 'Sound' },
  { k: 'vibrate', label: 'Vibration' },
  { k: 'glow', label: 'Glow' },
  { k: 'outline', label: 'Piece outlines', apply: () => { rebuildGraphics(); afterChange(); } },
  { k: 'sharp', label: 'Sharp graphics', apply: () => resizeCanvas() },
];

/* =====================================================================
   2. State
   ===================================================================== */

const stage = $('stage'), view = $('view'), vctx = view.getContext('2d');
const chipsEl = $('chips'), dockLabel = $('dockLabel');
const hitCtx = document.createElement('canvas').getContext('2d');
const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
const PILE_COLORS = ['#F2C14E', '#7FC8E8', '#E8848C', '#9BD17A', '#C7A4F0', '#F0A35E'];

let img = null;          // the picture, already scaled down
let P = null;            // puzzle geometry
let pieces = [], grid = [];
let items = [];          // every unplaced group, back to front
let table = null;        // world rectangle pieces can lie in
let boardCanvas = null;  // placed pieces are painted into this
let piles = [], openPile = null, pileCount = 0;
let mode = 'puzzle';
let selected = new Set();
let sortList = [], sortK = 1;
let cam = { x: 0, y: 0, s: 1 };
let peek = false;
let colors = {};

/* =====================================================================
   3. Cutting (seeded, so a saved puzzle can be rebuilt exactly)
   ===================================================================== */

function rng(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function gridFor(n, aspect){
  const cols = Math.max(2, Math.round(Math.sqrt(n * aspect)));
  const rows = Math.max(2, Math.round(n / cols));
  return { cols, rows };
}

function makePuzzle(seed, count, cols, rows){
  const R = rng(seed), flip = () => R() < 0.5 ? 1 : -1;
  const h = Array.from({length: rows - 1}, () => Array.from({length: cols}, flip));
  const v = Array.from({length: rows}, () => Array.from({length: cols - 1}, flip));
  P = { seed, count, cols, rows, W: img.width, H: img.height };
  P.pw = P.W / cols; P.ph = P.H / rows;
  pieces = []; grid = Array.from({length: rows}, () => []);
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const p = {
        i: r * cols + c, r, c, where: 'box', placed: false, touched: false, group: null,
        top:    r > 0        ? -h[r-1][c] : 0,
        right:  c < cols - 1 ?  v[r][c]   : 0,
        bottom: r < rows - 1 ?  h[r][c]   : 0,
        left:   c > 0        ? -v[r][c-1] : 0,
        hx: (R() - .5) * 24, hy: (R() - .5) * 10, hr: (R() - .5) * 1.3,
      };
      pieces.push(p); grid[r][c] = p;
    }
  }
}

const at = (r, c) => grid[r] ? grid[r][c] : undefined;
const isEdge = p => !p.top || !p.right || !p.bottom || !p.left;

// The table: the frame on top, and an area for loose pieces right underneath it,
// the same width as the frame. New pieces only ever land in that area.
let tray = null;
function computeTable(){
  const out = Math.min(S.cap, P.count) * 1.1;
  const cell = (P.pw + 2 * P.pw * S.tab / 100) * (P.ph + 2 * P.ph * S.tab / 100);
  const m = P.pw * S.tab / 100 + 4, gap = P.ph * 0.35;
  const w = P.W + 2 * m;
  const trayH = Math.max(P.ph * 2.5, out * cell * 1.35 / w);
  tray = { x: -m, y: P.H + gap, w, h: trayH };
  let x0 = -m, y0 = -m, x1 = x0 + w, y1 = tray.y + trayH + m;
  // Never shrink the table out from under pieces already lying on it.
  for (const g of items){
    if (!isVisible(g)) continue;
    const r = groupRect(g);
    x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h);
  }
  table = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

/* =====================================================================
   4. Graphics: piece shapes, sprite sheets, group images, the board
   ===================================================================== */

function edge(Pth, ax, ay, bx, by, s, T){
  if (!s){ Pth.lineTo(bx, by); return; }
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
  const nx = dy / L, ny = -dx / L;
  const pt = (t, n) => [ax + dx*t + nx*n*T*s, ay + dy*t + ny*n*T*s];
  Pth.lineTo(...pt(0.35, 0));
  Pth.bezierCurveTo(...pt(0.40, 0),    ...pt(0.42, 0.05), ...pt(0.40, 0.08));
  Pth.bezierCurveTo(...pt(0.34, 0.16), ...pt(0.38, 0.26), ...pt(0.50, 0.26));
  Pth.bezierCurveTo(...pt(0.62, 0.26), ...pt(0.66, 0.16), ...pt(0.60, 0.08));
  Pth.bezierCurveTo(...pt(0.58, 0.05), ...pt(0.60, 0),    ...pt(0.65, 0));
  Pth.lineTo(bx, by);
}

// Path in the piece's own sprite coordinates (the picture area starts at pad, pad).
function piecePath(p){
  const { pw, ph, pad, tabH } = P, T = tabH / 0.26;
  const x0 = pad, y0 = pad, x1 = pad + pw, y1 = pad + ph;
  const Pth = new Path2D();
  Pth.moveTo(x0, y0);
  edge(Pth, x0, y0, x1, y0, p.top, T);
  edge(Pth, x1, y0, x1, y1, p.right, T);
  edge(Pth, x1, y1, x0, y1, p.bottom, T);
  edge(Pth, x0, y1, x0, y0, p.left, T);
  Pth.closePath();
  return Pth;
}

// Copy the picture area under a piece (clipped by whatever clip is active).
function drawImageRegion(ctx, x0, y0, w, h, dx, dy){
  let sx = x0, sy = y0, ox = dx, oy = dy, sw = w, sh = h;
  if (sx < 0){ ox -= sx; sw += sx; sx = 0; }
  if (sy < 0){ oy -= sy; sh += sy; sy = 0; }
  sw = Math.min(sw, P.W - sx); sh = Math.min(sh, P.H - sy);
  if (sw > 0 && sh > 0) ctx.drawImage(img, sx, sy, sw, sh, ox, oy, sw, sh);
}

let sheets = [];
function buildSprites(){
  const sw = Math.ceil(P.pw + 2 * P.pad), sh = Math.ceil(P.ph + 2 * P.pad);
  const SHEET = 2048;
  const perRow = Math.max(1, Math.floor(SHEET / sw));
  const perSheet = perRow * Math.max(1, Math.floor(SHEET / sh));
  sheets = [];
  const T = Math.min(P.pw, P.ph);
  pieces.forEach((p, k) => {
    const si = Math.floor(k / perSheet), j = k % perSheet;
    if (!sheets[si]){
      const n = Math.min(perSheet, pieces.length - si * perSheet);
      const c = document.createElement('canvas');
      c.width = Math.min(perRow, n) * sw; c.height = Math.ceil(n / perRow) * sh;
      sheets[si] = c;
    }
    p.sp = { c: sheets[si], x: (j % perRow) * sw, y: Math.floor(j / perRow) * sh, w: sw, h: sh };
    const ctx = sheets[si].getContext('2d');
    ctx.save();
    ctx.translate(p.sp.x, p.sp.y);
    ctx.beginPath(); ctx.rect(0, 0, sw, sh); ctx.clip();
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = T * .05; ctx.shadowOffsetY = T * .02;
    ctx.fillStyle = '#000'; ctx.fill(p.path);
    ctx.restore();
    ctx.save(); ctx.clip(p.path);
    drawImageRegion(ctx, p.c * P.pw - P.pad, p.r * P.ph - P.pad, sw, sh, 0, 0);
    ctx.restore();
    if (S.outline){ ctx.lineWidth = Math.max(1, T * .015); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke(p.path); }
    ctx.restore();
  });
}

// A joined group is drawn as one image, so 30 joined pieces cost the same as 1.
function buildGroupImage(g){
  if (g.pieces.length === 1){ g.sp = null; return; }
  let minC = Infinity, maxC = -1, minR = Infinity, maxR = -1;
  g.pieces.forEach(p => { minC = Math.min(minC, p.c); maxC = Math.max(maxC, p.c); minR = Math.min(minR, p.r); maxR = Math.max(maxR, p.r); });
  const ox = minC * P.pw - P.pad, oy = minR * P.ph - P.pad;
  const w = Math.ceil((maxC - minC + 1) * P.pw + 2 * P.pad), h = Math.ceil((maxR - minR + 1) * P.ph + 2 * P.pad);
  const U = new Path2D();
  g.pieces.forEach(p => U.addPath(p.path, new DOMMatrix([1, 0, 0, 1, p.c * P.pw - P.pad - ox, p.r * P.ph - P.pad - oy])));
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const t = tmp.getContext('2d');
  t.save(); t.clip(U); drawImageRegion(t, ox, oy, w, h, 0, 0); t.restore();
  const T = Math.min(P.pw, P.ph);
  if (S.outline){ t.lineWidth = Math.max(1, T * .015); t.strokeStyle = 'rgba(255,255,255,.6)'; t.stroke(U); }
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d');
  o.shadowColor = 'rgba(0,0,0,.45)'; o.shadowBlur = T * .05; o.shadowOffsetY = T * .02;
  o.drawImage(tmp, 0, 0);
  g.sp = { c: out, x: 0, y: 0, w, h };
  g.ox = ox; g.oy = oy;
  g.bbox = { minC, maxC, minR, maxR };
}

function paintPlaced(list){
  const ctx = boardCanvas.getContext('2d');
  list.forEach(p => {
    const x = p.c * P.pw - P.pad, y = p.r * P.ph - P.pad;
    ctx.save(); ctx.translate(x, y); ctx.clip(p.path);
    drawImageRegion(ctx, x, y, p.sp.w, p.sp.h, 0, 0);
    ctx.restore();
  });
}

function rebuildGraphics(){
  P.tabH = Math.min(P.pw, P.ph) * S.tab / 100;
  P.pad = Math.ceil(P.tabH + Math.min(P.pw, P.ph) * .09 + 3);
  pieces.forEach(p => p.path = piecePath(p));
  buildSprites();
  items.forEach(buildGroupImage);
  boardCanvas = document.createElement('canvas');
  boardCanvas.width = P.W; boardCanvas.height = P.H;
  paintPlaced(pieces.filter(p => p.placed));
  computeTable();
  invalidate();
}

/* =====================================================================
   5. Groups
   ===================================================================== */

// A group's position (gx, gy) is where the picture's top-left corner would be.
// Every piece in it sits at (gx + c*pw, gy + r*ph). At (0, 0) it's home.
function makeGroup(list, gx, gy){
  const g = { pieces: list, gx, gy, sp: null };
  list.forEach(p => p.group = g);
  updateBBox(g);
  return g;
}
function updateBBox(g){
  let minC = Infinity, maxC = -1, minR = Infinity, maxR = -1;
  g.pieces.forEach(p => { minC = Math.min(minC, p.c); maxC = Math.max(maxC, p.c); minR = Math.min(minR, p.r); maxR = Math.max(maxR, p.r); });
  g.bbox = { minC, maxC, minR, maxR };
}
const isSingle = g => g.pieces.length === 1;

function groupRect(g){
  const b = g.bbox;
  return { x: g.gx + b.minC * P.pw - P.pad, y: g.gy + b.minR * P.ph - P.pad,
           w: (b.maxC - b.minC + 1) * P.pw + 2 * P.pad, h: (b.maxR - b.minR + 1) * P.ph + 2 * P.pad };
}

function isVisible(g){
  if (!isSingle(g)) return true;
  const w = g.pieces[0].where;
  return w === 'table' || (openPile !== null && w === openPile);
}

function toFront(g){
  const i = items.indexOf(g);
  if (i >= 0){ items.splice(i, 1); items.push(g); }
}

function merge(a, b){
  a.pieces.forEach(p => { p.group = b; b.pieces.push(p); });
  b.pieces.forEach(p => p.where = 'table');
  items.splice(items.indexOf(a), 1);
  updateBBox(b);
  buildGroupImage(b);
  toFront(b);
  return b;
}

/* =====================================================================
   6. Camera
   ===================================================================== */

let VW = 0, VH = 0, dpr = 1;
const cache = document.createElement('canvas'), cctx = cache.getContext('2d');

function resizeCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, S.sharp ? 2 : 1.25);
  VW = stage.clientWidth; VH = stage.clientHeight;
  for (const c of [view, cache]){ c.width = Math.round(VW * dpr); c.height = Math.round(VH * dpr); }
  view.style.width = VW + 'px'; view.style.height = VH + 'px';
  if (P){ computeTable(); clampCam(); if (mode === 'sort') enterSort(); }
  invalidate();
}

const minScale = () => Math.min(VW / table.w, VH / table.h) * 0.9;
const maxScale = () => Math.min(VW, VH) * 0.6 / Math.min(P.pw, P.ph);

// Keep the view on the table: no scrolling off into empty space.
// If the whole table fits on screen in one direction, centre it that way.
function clampCam(){
  cam.s = Math.min(Math.max(cam.s, minScale()), maxScale());
  const vw = VW / cam.s, vh = VH / cam.s, pad = 12 / cam.s;
  const x0 = table.x - pad, x1 = table.x + table.w + pad, y0 = table.y - pad, y1 = table.y + table.h + pad;
  cam.x = vw >= x1 - x0 ? (x0 + x1 - vw) / 2 : Math.min(Math.max(cam.x, x0), x1 - vw);
  cam.y = vh >= y1 - y0 ? (y0 + y1 - vh) / 2 : Math.min(Math.max(cam.y, y0), y1 - vh);
}

function fitTarget(){
  const s = Math.min(VW / table.w, VH / table.h) * 0.98;
  return { s, x: table.x + table.w / 2 - VW / (2 * s), y: table.y + table.h / 2 - VH / (2 * s) };
}

const toWorld = (sx, sy) => ({ x: cam.x + sx / cam.s, y: cam.y + sy / cam.s });

function zoomTarget(sx, sy, s){
  const w = toWorld(sx, sy);
  s = Math.min(Math.max(s, minScale()), maxScale());
  return { s, x: w.x - sx / s, y: w.y - sy / s };
}

let camAnim = null;
function animateCam(to){
  camAnim = { from: { ...cam }, to, t0: performance.now(), dur: 260 };
  invalidate();
}

/* =====================================================================
   7. Drawing
   ===================================================================== */

let drawQueued = false, cacheValid = false;
const effects = [];

function invalidate(){ cacheValid = false; requestDraw(); }
function requestDraw(){ if (!drawQueued){ drawQueued = true; requestAnimationFrame(frame); } }

function readColors(){
  const cs = getComputedStyle(document.documentElement);
  colors = { felt: cs.getPropertyValue('--felt').trim(), deep: cs.getPropertyValue('--felt-deep').trim() };
  invalidate();
}

function worldTransform(ctx){
  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, -cam.x * cam.s * dpr, -cam.y * cam.s * dpr);
}

function drawGroup(ctx, g){
  const p = g.pieces[0];
  if (isSingle(g)){
    const sp = p.sp;
    ctx.drawImage(sp.c, sp.x, sp.y, sp.w, sp.h, g.gx + p.c * P.pw - P.pad, g.gy + p.r * P.ph - P.pad, sp.w, sp.h);
  } else {
    ctx.drawImage(g.sp.c, g.gx + g.ox, g.gy + g.oy);
  }
}

function drawSortPiece(ctx, p){
  const sp = p.sp;
  ctx.drawImage(sp.c, sp.x, sp.y, sp.w, sp.h, p.sx, p.sy, sp.w * sortK, sp.h * sortK);
  if (selected.has(p)){
    ctx.save();
    ctx.translate(p.sx, p.sy); ctx.scale(sortK, sortK);
    ctx.lineWidth = 4 / sortK; ctx.strokeStyle = '#F2C14E'; ctx.stroke(p.path);
    ctx.restore();
  }
}

function drawScene(ctx, skip){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = colors.felt; ctx.fillRect(0, 0, view.width, view.height);
  if (!P) return;
  if (mode === 'sort'){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const p of sortList) if (p !== skip) drawSortPiece(ctx, p);
    return;
  }
  worldTransform(ctx);
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  ctx.beginPath(); ctx.roundRect(tray.x, tray.y, tray.w, tray.h, Math.min(P.pw, P.ph) * .3); ctx.fill();
  ctx.fillStyle = colors.deep; ctx.fillRect(0, 0, P.W, P.H);
  if (peek){ ctx.globalAlpha = .3; ctx.drawImage(img, 0, 0); ctx.globalAlpha = 1; }
  ctx.drawImage(boardCanvas, 0, 0);
  const vx0 = cam.x, vy0 = cam.y, vx1 = cam.x + VW / cam.s, vy1 = cam.y + VH / cam.s;
  for (const g of items){
    if (g === skip || !isVisible(g)) continue;
    const r = groupRect(g);
    if (r.x > vx1 || r.y > vy1 || r.x + r.w < vx0 || r.y + r.h < vy0) continue;
    drawGroup(ctx, g);
  }
}

function frame(now){
  drawQueued = false;
  let more = false;

  if (camAnim){
    const k = Math.min(1, (now - camAnim.t0) / camAnim.dur), e = 1 - Math.pow(1 - k, 3);
    for (const key of ['x', 'y', 's']) cam[key] = camAnim.from[key] + (camAnim.to[key] - camAnim.from[key]) * e;
    cacheValid = false;
    if (k >= 1){ camAnim = null; clampCam(); scheduleSave(); } else more = true;
  }
  if (drag && drag.moved && drag.edge && mode === 'puzzle' && now - drag.edgeT <= 300) more = true;
  if (drag && drag.moved && drag.edge && mode === 'puzzle' && now - drag.edgeT > 300){
    const step = 10 / cam.s, before = { x: cam.x, y: cam.y };
    cam.x += drag.edge.x * step; cam.y += drag.edge.y * step; clampCam();
    const dx = cam.x - before.x, dy = cam.y - before.y;
    if (dx || dy){ drag.item.gx += dx; drag.item.gy += dy; cacheValid = false; more = true; }
  }

  const dragging = drag && drag.moved ? drag.item : null;
  if (dragging){
    if (!cacheValid){ drawScene(cctx, dragging); cacheValid = true; }
    vctx.setTransform(1, 0, 0, 1, 0, 0);
    vctx.drawImage(cache, 0, 0);
    vctx.save();
    if (mode === 'sort') vctx.setTransform(dpr, 0, 0, dpr, 0, 0); else worldTransform(vctx);
    vctx.shadowColor = 'rgba(0,0,0,.35)'; vctx.shadowBlur = 14 * dpr; vctx.shadowOffsetY = 8 * dpr;
    if (mode === 'sort') drawSortPiece(vctx, dragging); else drawGroup(vctx, dragging);
    vctx.restore();
  } else {
    drawScene(vctx, null);
  }

  if (effects.length && mode === 'puzzle'){
    worldTransform(vctx);
    for (let i = effects.length - 1; i >= 0; i--){
      const fx = effects[i], k = (now - fx.t0) / 700;
      if (k >= 1){ effects.splice(i, 1); continue; }
      vctx.strokeStyle = `rgba(242,193,78,${1 - k})`;
      vctx.lineWidth = (3 + 6 * (1 - k)) / cam.s;
      for (const p of fx.pieces){
        vctx.save();
        vctx.translate(fx.g.gx + p.c * P.pw - P.pad, fx.g.gy + p.r * P.ph - P.pad);
        vctx.stroke(p.path);
        vctx.restore();
      }
      more = true;
    }
  }
  if (more) requestDraw();
}

/* =====================================================================
   8. Feeding the table from the box, scattering, piles
   ===================================================================== */

const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const visibleSingles = () => pieces.filter(p => !p.placed && isSingle(p.group) && isVisible(p.group));
const inPile = id => pieces.filter(p => !p.placed && isSingle(p.group) && p.where === id);

// Put pieces at random spots on the table, off the frame, not too bunched up.
// nearView: prefer the part of the table you're looking at.
function scatterOnTable(list, nearView){
  let area = tray;
  if (nearView){
    const v = { x: cam.x, y: cam.y, w: VW / cam.s, h: VH / cam.s };
    const x0 = Math.max(v.x, tray.x), y0 = Math.max(v.y, tray.y);
    const x1 = Math.min(v.x + v.w, tray.x + tray.w), y1 = Math.min(v.y + v.h, tray.y + tray.h);
    if (x1 - x0 > P.pw * 2 && y1 - y0 > P.ph * 2) area = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  const m = P.tabH;
  const pts = visibleSingles().filter(p => !list.includes(p)).map(p => ({ x: p.group.gx + p.c * P.pw, y: p.group.gy + p.r * P.ph }));
  const rw = Math.max(0, area.w - P.pw - 2 * m), rh = Math.max(0, area.h - P.ph - 2 * m);
  const onBoard = (x, y) => x + P.pw + m > 0 && x - m < P.W && y + P.ph + m > 0 && y - m < P.H;
  for (const p of list){
    let best = null, bd = -1;
    for (let i = 0, ok = 0; i < 30 && ok < 4; i++){
      const x = area.x + m + Math.random() * rw, y = area.y + m + Math.random() * rh;
      if (onBoard(x, y) && i < 29) continue;
      ok++;
      let d = Infinity;
      for (const q of pts){ const dd = (q.x - x) ** 2 + (q.y - y) ** 2; if (dd < d) d = dd; }
      if (d > bd){ bd = d; best = { x, y }; }
    }
    pts.push(best);
    p.group.gx = best.x - p.c * P.pw; p.group.gy = best.y - p.r * P.ph;
    // Slip in at a random depth, so new pieces don't pop out on top.
    const i = items.indexOf(p.group);
    if (i >= 0){ items.splice(i, 1); items.splice(Math.floor(Math.random() * (items.length + 1)), 0, p.group); }
  }
}

// Keep the table topped up to the limit, taking pieces from the box.
function feed(exclude){
  const need = S.cap - visibleSingles().length;
  if (need <= 0) return 0;
  const box = shuffle(inPile('box').filter(p => !exclude || !exclude.has(p))).slice(0, need);
  box.forEach(p => p.where = 'table');
  scatterOnTable(box, false);
  return box.length;
}

function prune(){
  piles = piles.filter(pl => inPile(pl.id).length > 0);
  if (openPile !== null && !piles.some(pl => pl.id === openPile)) openPile = null;
}

function moveToPile(list, id){
  if (id === 'new'){
    id = 'p' + Date.now();
    piles.push({ id, color: PILE_COLORS[pileCount++ % PILE_COLORS.length] });
  }
  list.forEach(p => { p.where = id; p.touched = true; selected.delete(p); });
  if (mode === 'puzzle' && id === openPile) scatterOnTable(list, true);
  pulseHeap(id);
  buzz(15); chime([880]);
  afterChange();
}

// Swap some untouched table pieces for fresh ones from the box.
function rummage(){
  const loose = shuffle(pieces.filter(p => p.where === 'table' && !p.touched && isSingle(p.group) && !p.placed)).slice(0, 10);
  if (!loose.length){ toast('Every piece on the table has been moved, so there’s nothing to swap.'); return; }
  loose.forEach(p => p.where = 'box');
  const n = feed(new Set(loose));
  pulseHeap('box'); chime([440, 494]);
  toast(n ? `Swapped ${n} pieces with the box.` : 'The box has no other pieces to swap.');
  if (!n) loose.forEach(p => p.where = 'table');
  afterChange();
}

function heapTap(id){
  if (mode === 'sort' && selected.size){ moveToPile([...selected], id); return; }
  if (id === 'new') return;
  if (id === 'box'){ if (mode === 'puzzle') rummage(); return; }
  if (openPile === id) openPile = null;
  else {
    openPile = id;
    if (mode === 'puzzle') scatterOnTable(inPile(id), true);
  }
  if (mode === 'sort') enterSort();
  afterChange();
}

/* =====================================================================
   9. The pile shelf
   ===================================================================== */

function drawHeap(cv, list, kind){
  const W = 92, H = 62, d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(d, d);
  if (kind === 'box'){
    ctx.fillStyle = '#7A5A3C'; ctx.beginPath(); ctx.roundRect(10, 30, 72, 30, 5); ctx.fill();
    ctx.fillStyle = '#9C7650'; ctx.fillRect(10, 30, 72, 6);
  }
  if (!list.length){
    if (kind === 'box') return;
    ctx.strokeStyle = 'rgba(255,248,236,.45)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.ellipse(W/2, H/2 + 4, 32, 20, 0, 0, Math.PI*2); ctx.stroke();
    if (kind === 'new'){
      ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,248,236,.85)'; ctx.font = '700 28px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', W/2, H/2 + 5);
    }
    return;
  }
  const shown = list.slice().sort((a, b) => a.i - b.i).slice(0, Math.min(8, 2 + Math.ceil(list.length / 3)));
  const k = 34 / Math.max(P.pw, P.ph);
  const w = (P.pw + 2*P.pad) * k, h = (P.ph + 2*P.pad) * k;
  const baseY = kind === 'box' ? H/2 - 2 : H/2 + 8;
  shown.forEach((p, i) => {
    ctx.save();
    ctx.translate(W/2 + p.hx, baseY + p.hy * .6 - i * 1.5);
    ctx.rotate(p.hr);
    ctx.drawImage(p.sp.c, p.sp.x, p.sp.y, p.sp.w, p.sp.h, -w/2, -h/2, w, h);
    ctx.restore();
  });
}

function renderDock(){
  const n = selected.size, moving = mode === 'sort' && n > 0;
  dockLabel.hidden = !moving;
  dockLabel.textContent = moving ? `Tap a pile to move ${n} piece${n > 1 ? 's' : ''}` : '';
  chipsEl.textContent = '';
  const make = (id, kind, color, list, open, label) => {
    const b = document.createElement('button');
    b.className = 'heap'; b.dataset.id = id;
    b.setAttribute('aria-pressed', !!open && !moving);
    b.setAttribute('aria-label', label);
    const cv = document.createElement('canvas');
    drawHeap(cv, open ? [] : list, kind);
    b.appendChild(cv);
    if (kind !== 'new'){
      const tag = document.createElement('span'); tag.className = 'tag';
      if (color){ const dot = document.createElement('i'); dot.style.background = color; tag.appendChild(dot); }
      const num = document.createElement('b'); num.textContent = list.length; tag.appendChild(num);
      b.appendChild(tag);
    }
    b.addEventListener('click', () => heapTap(id));
    chipsEl.appendChild(b);
  };
  const box = inPile('box');
  make('box', 'box', null, box, false, `Puzzle box, ${box.length} pieces. Tap to swap pieces.`);
  piles.forEach((pl, i) => {
    const list = inPile(pl.id), open = pl.id === openPile;
    make(pl.id, 'pile', pl.color, list, open, `Pile ${i + 1}, ${list.length} pieces${open ? ', open' : ''}`);
  });
  make('new', 'new', null, [], false, 'Drop pieces here to start a new pile');
}

function pulseHeap(id){
  requestAnimationFrame(() => {
    const c = chipsEl.querySelector(`.heap[data-id="${id}"]`); if (!c) return;
    c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
  });
}
function heapAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('#chips .heap[data-id]') : null;
}

/* =====================================================================
   10. Sort view
   ===================================================================== */

function sortSource(){ return openPile !== null ? inPile(openPile) : inPile('table'); }

function scatterSort(list){
  const sw = P.pad * 2 + P.pw, sh = P.pad * 2 + P.ph;
  const w = sw * sortK, h = sh * sortK, rw = Math.max(0, VW - w), rh = Math.max(0, VH - h);
  const pts = sortList.filter(p => !list.includes(p)).map(p => ({ x: p.sx, y: p.sy }));
  for (const p of list){
    let best = null, bd = -1;
    for (let i = 0; i < 4; i++){
      const x = Math.random() * rw, y = Math.random() * rh;
      let d = Infinity;
      for (const q of pts){ const dd = (q.x - x) ** 2 + (q.y - y) ** 2; if (dd < d) d = dd; }
      if (d > bd){ bd = d; best = { x, y }; }
    }
    pts.push(best); p.sx = best.x; p.sy = best.y;
  }
}

function enterSort(){
  sortList = shuffle(sortSource());
  const sw = P.pad * 2 + P.pw, sh = P.pad * 2 + P.ph, n = Math.max(1, sortList.length);
  const fitK = Math.sqrt(VW * VH * 1.1 / (n * sw * sh));
  sortK = Math.max(36 / Math.min(P.pw, P.ph), Math.min(S.sortSize / Math.min(P.pw, P.ph), fitK));
  scatterSort(sortList);
  invalidate();
}

// After a change: drop pieces that left the view, scatter ones that arrived.
function refreshSort(){
  const now = sortSource(), had = new Set(sortList);
  const keep = sortList.filter(p => now.includes(p));
  const fresh = now.filter(p => !had.has(p));
  sortList = keep;
  scatterSort(fresh);
  sortList = keep.concat(fresh);
}

/* =====================================================================
   11. Feedback
   ===================================================================== */

let actx = null;
function ensureAudio(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function chime(notes){
  if (!actx || !S.sound) return;
  notes.forEach((f, i) => {
    const t = actx.currentTime + i * 0.09;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(gn).connect(actx.destination);
    o.start(t); o.stop(t + 0.35);
  });
}
function buzz(pattern){ if (S.vibrate && navigator.vibrate) navigator.vibrate(pattern); }
function glow(g, list){ if (S.glow){ effects.push({ g: { gx: g.gx, gy: g.gy }, pieces: list.slice(), t0: performance.now() }); requestDraw(); } }

let toastTimer;
function toast(text){
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* =====================================================================
   12. After every change
   ===================================================================== */

function afterChange(){
  prune();
  feed();
  if (mode === 'sort') refreshSort();
  renderDock();
  $('empty').classList.toggle('show', mode === 'sort' && sortList.length === 0);
  const placed = pieces.filter(p => p.placed).length;
  $('info').textContent = `This puzzle: ${pieces.length} pieces (${P.cols} × ${P.rows}), ${placed} in place.`;
  document.querySelectorAll('#counts button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === P.count));
  $('done').classList.toggle('show', mode === 'puzzle' && placed === pieces.length);
  scheduleSave();
  invalidate();
}

/* =====================================================================
   13. Touch: drag pieces, pan, pinch zoom, double-tap
   ===================================================================== */

const pointers = new Map();
let drag = null, pan = null, pinch = null, lastTap = { t: 0, x: 0, y: 0 };
const local = e => { const r = view.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

function hitGroup(g, wx, wy, tol){
  const r = groupRect(g);
  if (wx < r.x - tol || wy < r.y - tol || wx > r.x + r.w + tol || wy > r.y + r.h + tol) return false;
  for (const p of g.pieces){
    const lx = wx - (g.gx + p.c * P.pw - P.pad), ly = wy - (g.gy + p.r * P.ph - P.pad);
    if (tol){
      if (lx > P.pad - tol && ly > P.pad - tol && lx < P.pad + P.pw + tol && ly < P.pad + P.ph + tol) return true;
    } else if (hitCtx.isPointInPath(p.path, lx, ly)) return true;
  }
  return false;
}

function pickAt(pt){
  if (mode === 'sort'){
    for (const tol of [0, 14]){
      for (let i = sortList.length - 1; i >= 0; i--){
        const p = sortList[i], lx = (pt.x - p.sx) / sortK, ly = (pt.y - p.sy) / sortK;
        if (tol){
          const t = tol / sortK;
          if (lx > P.pad - t && ly > P.pad - t && lx < P.pad + P.pw + t && ly < P.pad + P.ph + t) return p;
        } else if (lx >= 0 && ly >= 0 && lx <= p.sp.w && ly <= p.sp.h && hitCtx.isPointInPath(p.path, lx, ly)) return p;
      }
    }
    return null;
  }
  const w = toWorld(pt.x, pt.y);
  for (const tol of [0, 14 / cam.s]){
    for (let i = items.length - 1; i >= 0; i--){
      const g = items[i];
      if (isVisible(g) && hitGroup(g, w.x, w.y, tol)) return g;
    }
  }
  return null;
}

function setHover(h){
  const old = chipsEl.querySelector('.heap.target');
  if (old && old !== h) old.classList.remove('target');
  if (h) h.classList.add('target');
}

view.addEventListener('contextmenu', e => e.preventDefault());

view.addEventListener('pointerdown', e => {
  ensureAudio();
  if (!P) return;
  view.setPointerCapture(e.pointerId);
  const pt = local(e);
  pointers.set(e.pointerId, pt);

  if (pointers.size === 2 && mode === 'puzzle'){
    if (drag){ // second finger: stop dragging, start zooming
      if (drag.moved){ drag.item.gx = drag.ox; drag.item.gy = drag.oy; }
      drag = null; setHover(null);
    }
    pan = null; camAnim = null;
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: cam.s, w: toWorld(mid.x, mid.y) };
    invalidate();
    return;
  }
  if (pointers.size !== 1) return;

  const hit = pickAt(pt);
  if (hit){
    drag = { item: hit, id: e.pointerId, start: pt, last: pt, moved: false };
    if (mode === 'puzzle'){ drag.ox = hit.gx; drag.oy = hit.gy; toFront(hit); }
    else { sortList.splice(sortList.indexOf(hit), 1); sortList.push(hit); }
  } else if (mode === 'puzzle'){
    camAnim = null;
    pan = { id: e.pointerId, last: pt, start: pt, moved: false };
  }
});

view.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const pt = local(e);
  pointers.set(e.pointerId, pt);

  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    cam.s = Math.min(Math.max(pinch.s0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0, minScale()), maxScale());
    cam.x = pinch.w.x - mid.x / cam.s; cam.y = pinch.w.y - mid.y / cam.s;
    clampCam(); invalidate();
    return;
  }

  if (drag && drag.id === e.pointerId){
    if (!drag.moved){
      if (Math.hypot(pt.x - drag.start.x, pt.y - drag.start.y) < 7) return;
      drag.moved = true; cacheValid = false;
    }
    const dx = pt.x - drag.last.x, dy = pt.y - drag.last.y;
    drag.last = pt;
    if (mode === 'puzzle'){
      const g = drag.item;
      g.gx += dx / cam.s; g.gy += dy / cam.s;
      const r = groupRect(g), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      g.gx += Math.min(Math.max(cx, table.x), table.x + table.w) - cx;
      g.gy += Math.min(Math.max(cy, table.y), table.y + table.h) - cy;
      const E = 36;
      drag.edge = { x: pt.x < E ? -1 : pt.x > VW - E ? 1 : 0, y: pt.y < E ? -1 : (pt.y > VH - E && pt.y <= VH) ? 1 : 0 };
      if (!drag.edge.x && !drag.edge.y) drag.edge = null;
      else if (!drag.edgeT) drag.edgeT = performance.now();
      if (!drag.edge) drag.edgeT = 0;
      if (drag.edge) requestDraw();
    } else {
      const p = drag.item, w = p.sp.w * sortK, h = p.sp.h * sortK;
      p.sx = Math.min(Math.max(p.sx + dx, -w / 3), VW - w * 2 / 3);
      p.sy = Math.min(Math.max(p.sy + dy, -h / 3), VH - h * 2 / 3);
    }
    const canPile = mode === 'sort' || isSingle(drag.item);
    setHover(canPile ? heapAt(e.clientX, e.clientY) : null);
    requestDraw();
    return;
  }

  if (pan && pan.id === e.pointerId){
    if (!pan.moved && Math.hypot(pt.x - pan.start.x, pt.y - pan.start.y) < 7) return;
    pan.moved = true;
    cam.x -= (pt.x - pan.last.x) / cam.s; cam.y -= (pt.y - pan.last.y) / cam.s;
    pan.last = pt;
    clampCam(); invalidate();
  }
});

function pointerEnd(e){
  if (!pointers.has(e.pointerId)) return;
  const pt = local(e);
  pointers.delete(e.pointerId);

  if (pinch){
    if (pointers.size < 2){
      pinch = null;
      if (pointers.size === 1){ // keep panning with the finger that's left
        const [id, p] = [...pointers.entries()][0];
        pan = { id, last: p, start: p, moved: true };
      }
      scheduleSave();
    }
    return;
  }
  if (drag && drag.id === e.pointerId){ finishDrag(e, e.type === 'pointercancel'); return; }
  if (pan && pan.id === e.pointerId){
    if (!pan.moved && e.type === 'pointerup') handleTap(pt);
    pan = null; scheduleSave();
  }
}
view.addEventListener('pointerup', pointerEnd);
view.addEventListener('pointercancel', pointerEnd);

view.addEventListener('wheel', e => {
  if (mode !== 'puzzle' || !P) return;
  e.preventDefault();
  const pt = local(e), t = zoomTarget(pt.x, pt.y, cam.s * Math.exp(-e.deltaY * 0.0015));
  Object.assign(cam, t); clampCam(); invalidate(); scheduleSave();
}, { passive: false });

function handleTap(pt){
  const now = performance.now();
  if (now - lastTap.t < 320 && Math.hypot(pt.x - lastTap.x, pt.y - lastTap.y) < 30){
    lastTap.t = 0;
    const fit = fitTarget();
    animateCam(cam.s > fit.s * 1.8 ? fit : zoomTarget(pt.x, pt.y, cam.s * 2.5));
  } else lastTap = { t: now, x: pt.x, y: pt.y };
}

function finishDrag(e, cancelled){
  const d = drag; drag = null;
  setHover(null);
  cacheValid = false;
  if (!d.moved){
    if (mode === 'sort' && !cancelled){
      const p = d.item;
      if (selected.has(p)) selected.delete(p); else selected.add(p);
      renderDock();
    }
    requestDraw();
    return;
  }
  const heap = cancelled ? null : heapAt(e.clientX, e.clientY);

  if (mode === 'sort'){
    if (heap){
      const p = d.item;
      moveToPile(selected.has(p) ? [...selected] : [p], heap.dataset.id);
    } else requestDraw();
    return;
  }

  let g = d.item;
  if (heap && isSingle(g)){ moveToPile([g.pieces[0]], heap.dataset.id); return; }
  g.pieces.forEach(p => p.touched = true);
  if (cancelled){ afterChange(); return; }

  const T = Math.min(P.pw, P.ph);
  const snapFrame = Math.max(6, T * S.snapFrame / 100), snapJoin = Math.max(6, T * S.snapJoin / 100);

  // Near its spot in the frame: lock it in.
  if (Math.hypot(g.gx, g.gy) < snapFrame){
    g.gx = 0; g.gy = 0;
    g.pieces.forEach(p => { p.placed = true; p.where = 'placed'; });
    paintPlaced(g.pieces);
    items.splice(items.indexOf(g), 1);
    glow(g, g.pieces); buzz([20, 40, 20]); chime([523.25, 783.99]);
    if (pieces.every(p => p.placed)) setTimeout(() => chime([523.25, 659.25, 783.99, 1046.5]), 250);
    afterChange();
    return;
  }

  // Near a matching neighbour: join them.
  let joined = false, again = true;
  while (again){
    again = false;
    outer: for (const p of g.pieces){
      for (const [dr, dc] of DIRS){
        const n = at(p.r + dr, p.c + dc);
        if (!n || n.placed || n.group === g || !isVisible(n.group)) continue;
        const h = n.group;
        if (Math.hypot(g.gx - h.gx, g.gy - h.gy) < snapJoin){
          g = merge(g, h);
          joined = again = true;
          break outer;
        }
      }
    }
  }
  if (joined){ glow(g, g.pieces); buzz(25); chime([659.25]); }
  else if (isSingle(g)) g.pieces[0].where = 'table';
  afterChange();
}

/* =====================================================================
   14. Saving and loading (IndexedDB, on this device only)
   ===================================================================== */

const store = {
  db: null,
  async open(){
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('jigsaw', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k){
    const db = await this.open();
    return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async set(k, v){
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
  },
};

let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 600); }

function snapshot(){
  const r2 = v => Math.round(v * 100) / 100;
  return {
    v: 2, seed: P.seed, count: P.count, cols: P.cols, rows: P.rows,
    groups: items.map(g => ({ i: g.pieces.map(p => p.i), x: r2(g.gx), y: r2(g.gy) })),
    where: pieces.map(p => p.where),
    touched: pieces.filter(p => p.touched).map(p => p.i),
    piles, openPile, pileCount,
    cam: { x: r2(cam.x), y: r2(cam.y), s: cam.s },
  };
}
async function saveState(){
  clearTimeout(saveTimer);
  if (!P) return;
  try { await store.set('state', snapshot()); } catch (e) { console.warn('Could not save', e); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);

async function saveImage(){
  try {
    const blob = await new Promise(res => img.toBlob(res, 'image/jpeg', 0.9));
    if (blob) await store.set('image', blob);
  } catch (e) { console.warn('Could not save picture', e); }
}

async function blobToCanvas(blob){
  const bmp = await createImageBitmap(blob);
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  c.getContext('2d').drawImage(bmp, 0, 0);
  if (bmp.close) bmp.close();
  return c;
}

async function restore(){
  const st = await store.get('state'), blob = await store.get('image');
  if (!st || !blob || st.v !== 2) return false;
  img = await blobToCanvas(blob);
  makePuzzle(st.seed, st.count, st.cols, st.rows);
  pieces.forEach(p => { p.where = st.where[p.i]; p.placed = p.where === 'placed'; });
  st.touched.forEach(i => pieces[i].touched = true);
  items = st.groups.map(gr => makeGroup(gr.i.map(i => pieces[i]), gr.x, gr.y));
  piles = st.piles || []; openPile = st.openPile ?? null; pileCount = st.pileCount || 0;
  rebuildGraphics();
  cam = { ...st.cam };
  clampCam();
  return true;
}

/* =====================================================================
   15. New puzzles
   ===================================================================== */

// Scale big photos down: plenty of detail, much less memory.
function prepareImage(src){
  const max = S.sharp ? 2048 : 1600;
  const k = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}

const puzzleStarted = () => P && pieces.some(p => p.touched || p.placed) && !pieces.every(p => p.placed);
const confirmNew = () => !puzzleStarted() || confirm('Start a new puzzle? The one you’re working on will be lost.');

async function newPuzzle(picture, count){
  if (picture){ img = prepareImage(picture); saveImage(); }
  const seed = (Math.random() * 4294967296) >>> 0;
  const { cols, rows } = gridFor(count, img.width / img.height);
  makePuzzle(seed, count, cols, rows);
  items = pieces.map(p => makeGroup([p], 0, 0));
  piles = []; openPile = null; pileCount = 0; selected.clear(); effects.length = 0;
  peek = false; $('peek').setAttribute('aria-pressed', 'false');
  rebuildGraphics();
  Object.assign(cam, fitTarget());
  setMode('puzzle', true);
  afterChange();
}

/* =====================================================================
   16. Controls
   ===================================================================== */

function setMode(m, quiet){
  mode = m;
  document.body.dataset.mode = m;
  $('mPuzzle').setAttribute('aria-pressed', m === 'puzzle');
  $('mSort').setAttribute('aria-pressed', m === 'sort');
  selected.clear(); drag = null; pan = null; pinch = null; pointers.clear();
  if (m === 'sort') enterSort();
  if (!quiet) afterChange();
}

$('mPuzzle').addEventListener('click', () => setMode('puzzle'));
$('mSort').addEventListener('click', () => setMode('sort'));

$('peek').addEventListener('click', e => {
  peek = !peek; e.currentTarget.setAttribute('aria-pressed', peek); invalidate();
});

// Pull every edge piece out of the box too, so "edges first" works with 400 pieces.
$('selEdges').addEventListener('click', () => {
  if (openPile === null){
    const fromBox = inPile('box').filter(isEdge);
    fromBox.forEach(p => p.where = 'table');
    scatterOnTable(fromBox, false);
  }
  afterChange();
  sortList.filter(isEdge).forEach(p => selected.add(p));
  renderDock(); invalidate();
});
$('selNone').addEventListener('click', () => { selected.clear(); renderDock(); invalidate(); });
$('mix').addEventListener('click', () => { sortList = shuffle(sortList); scatterSort(sortList); chime([440, 494]); invalidate(); });

const zoomBy = f => animateCam(zoomTarget(VW / 2, VH / 2, cam.s * f));
$('zIn').addEventListener('click', () => zoomBy(1.6));
$('zOut').addEventListener('click', () => zoomBy(1 / 1.6));
$('zFit').addEventListener('click', () => animateCam(fitTarget()));

const dlg = $('settings');
$('openSettings').addEventListener('click', () => { afterChange(); dlg.showModal(); });
$('closeSettings').addEventListener('click', () => dlg.close());

document.querySelectorAll('#counts button').forEach(b => b.addEventListener('click', () => {
  if (!confirmNew()) return;
  dlg.close(); newPuzzle(null, +b.dataset.n);
}));
$('sample').addEventListener('click', () => {
  if (!confirmNew()) return;
  dlg.close(); newPuzzle(makeDemoImage(), P ? P.count : 100);
});
$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f || !confirmNew()) return;
  dlg.close();
  try {
    const bmp = await createImageBitmap(f);
    await newPuzzle(bmp, P ? P.count : 100);
    if (bmp.close) bmp.close();
  } catch (err) { toast('That picture couldn’t be opened.'); }
});
$('again').addEventListener('click', () => newPuzzle(null, P.count));

function buildSettingsUI(){
  const box = $('sliders'); box.textContent = '';
  SLIDERS.forEach(d => {
    const wrap = document.createElement('div'); wrap.className = 'field';
    const lab = document.createElement('label'); lab.htmlFor = 's-' + d.k;
    const out = document.createElement('output'); out.textContent = d.fmt(S[d.k]);
    lab.append(document.createTextNode(d.label), out);
    const inp = document.createElement('input');
    Object.assign(inp, { type: 'range', id: 's-' + d.k, min: d.min, max: d.max, step: d.step, value: S[d.k] });
    inp.addEventListener('input', () => { S[d.k] = +inp.value; out.textContent = d.fmt(S[d.k]); saveSettings(); });
    inp.addEventListener('change', () => { if (d.apply && P) d.apply(); });
    wrap.append(lab, inp); box.appendChild(wrap);
  });
  const tb = $('toggles'); tb.textContent = '';
  TOGGLES.forEach(d => {
    const b = document.createElement('button');
    b.textContent = d.label; b.setAttribute('aria-pressed', S[d.k]);
    b.addEventListener('click', () => {
      S[d.k] = !S[d.k]; b.setAttribute('aria-pressed', S[d.k]); saveSettings();
      if (d.apply && P) d.apply();
    });
    tb.appendChild(b);
  });
}
$('reset').addEventListener('click', () => {
  S = { ...DEFAULTS }; saveSettings(); buildSettingsUI();
  if (P){ rebuildGraphics(); resizeCanvas(); afterChange(); }
});

// Resize whenever the play area changes size (rotation, or the pile shelf growing).
let resizeTimer, lastSize = '';
new ResizeObserver(() => {
  const size = stage.clientWidth + 'x' + stage.clientHeight;
  if (size === lastSize) return;
  lastSize = size;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const refit = P && Math.abs(cam.s - fitTarget().s) < fitTarget().s * 0.05;
    resizeCanvas();
    if (refit) Object.assign(cam, fitTarget());
    invalidate();
  }, 100);
}).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);

/* =====================================================================
   17. Sample picture
   ===================================================================== */

function makeDemoImage(){
  const W = 1600, H = 1200, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#5FA8D9'); sky.addColorStop(1, '#F8D7A0');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = '#FFE38A'; g.beginPath(); g.arc(1180, 300, 110, 0, Math.PI*2); g.fill();
  const ridge = (base, amp, f, color, seed) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 10){
      const y = base - amp * (Math.sin(x*f + seed) * 0.6 + Math.sin(x*f*2.3 + seed*2) * 0.4);
      g.lineTo(x, y);
    }
    g.lineTo(W, H); g.fill();
  };
  ridge(560, 140, 0.004, '#7E8FB8', 1);
  ridge(640, 90, 0.006, '#4E7A6A', 3);
  g.fillStyle = '#3F7FB0'; g.fillRect(0, 700, W, 160);
  ridge(900, 50, 0.008, '#6BA34E', 5);
  ridge(1000, 30, 0.01, '#4F8A3A', 7);
  const house = (x, y, body, roof) => {
    g.fillStyle = body; g.fillRect(x, y, 160, 120);
    g.fillStyle = roof; g.beginPath(); g.moveTo(x-20, y); g.lineTo(x+80, y-80); g.lineTo(x+180, y); g.fill();
    g.fillStyle = '#FFF4D6'; g.fillRect(x+25, y+35, 35, 35); g.fillRect(x+100, y+35, 35, 35);
  };
  house(300, 860, '#C8443A', '#3A3A3A');
  house(560, 880, '#F2C14E', '#2F4A6A');
  house(1100, 870, '#F4F0E6', '#B0402E');
  const dots = ['#E8505B', '#FFFFFF', '#F2C14E', '#B07CE8'];
  for (let i = 0; i < 260; i++){
    g.fillStyle = dots[i % dots.length];
    g.beginPath(); g.arc(Math.random()*W, 1020 + Math.random()*170, 6 + Math.random()*6, 0, Math.PI*2); g.fill();
  }
  return c;
}

/* =====================================================================
   18. Start
   ===================================================================== */

(async () => {
  readColors();
  buildSettingsUI();
  resizeCanvas();
  let ok = false;
  try { ok = await restore(); } catch (e) { console.warn('No saved puzzle', e); }
  if (ok){ setMode('puzzle', true); afterChange(); }
  else await newPuzzle(makeDemoImage(), 100);
})();

if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Offline mode unavailable:', err));
  });
}
