<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jigsaw prototype</title>
<meta name="theme-color" content="#6E4B32">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Atkinson Hyperlegible'; font-weight:400; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible'; font-weight:700; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-latin-700-normal.woff2') format('woff2')}
:root{
  --felt:#3E5F4E; --felt-deep:#2F4A3C; --wood:#6E4B32; --wood-hi:#8A6244;
  --ink:#FFF8EC; --chip:#F0E4CC; --chip-ink:#3A2A1C; --glow:#F2C14E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --felt:#2A4236; --felt-deep:#1F332A; --wood:#4A3222; --wood-hi:#624430;
    --ink:#FBF3E4; --chip:#E3D3B4; --chip-ink:#2E2116; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --felt:#2A4236; --felt-deep:#1F332A; --wood:#4A3222; --wood-hi:#624430;
  --ink:#FBF3E4; --chip:#E3D3B4; --chip-ink:#2E2116; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--felt); color:var(--ink);
  font-family:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header,#dock{background:var(--wood); display:flex; gap:8px; align-items:center; padding:8px 10px}
header{flex-wrap:wrap}
button,.btn{
  min-height:48px; padding:0 16px; border:0; border-radius:12px;
  background:var(--wood-hi); color:var(--ink); font:inherit; font-size:18px;
  display:inline-flex; align-items:center; gap:8px; cursor:pointer;
}
button:focus-visible,.btn:focus-within{outline:3px solid var(--glow); outline-offset:2px}
button[aria-pressed="true"]{background:var(--chip); color:var(--chip-ink); font-weight:700}
.seg{display:flex; gap:4px}
#openSettings{margin-left:auto}
body[data-mode="puzzle"] .sort-only, body[data-mode="sort"] .puzzle-only{display:none}

#stage{position:relative; flex:1; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none}
#frame{position:absolute; background:var(--felt-deep); border-radius:3px; box-shadow:inset 0 2px 10px rgba(0,0,0,.4)}
#ghost{position:absolute; inset:0; width:100%; height:100%; opacity:0; transition:opacity .3s}
#frame.peek #ghost{opacity:.3}
#tray{position:absolute; border-radius:14px; background:rgba(0,0,0,.12)}
body[data-mode="sort"] #frame, body[data-mode="sort"] #tray, body[data-mode="sort"] #done{display:none}
#empty{position:absolute; display:none; padding:16px; font-size:18px; text-align:center; opacity:.85; line-height:1.4}
#empty.show{display:block}

.group{
  position:absolute; left:0; top:0; width:0; height:0; transform-origin:0 0;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)) drop-shadow(0 0 0 rgba(242,193,78,0));
}
.group.lifted{filter:drop-shadow(0 8px 10px rgba(0,0,0,.4)) drop-shadow(0 0 0 rgba(242,193,78,0))}
.group.placed{filter:drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 0 rgba(242,193,78,0))}
.group.sel{filter:drop-shadow(0 0 3px #F2C14E) drop-shadow(0 0 3px #F2C14E) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.group.join{animation:glow .7s ease-out}
.group.placed.join{animation:glowPlaced .9s ease-out}
@keyframes glow{
  0%  {filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)) drop-shadow(0 0 12px rgba(242,193,78,1))}
  100%{filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)) drop-shadow(0 0 0 rgba(242,193,78,0))}
}
@keyframes glowPlaced{
  0%  {filter:drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 14px rgba(242,193,78,1))}
  100%{filter:drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 0 rgba(242,193,78,0))}
}
canvas.piece{position:absolute; left:0; top:0}

/* The pile shelf: real stacks of pieces at the edge of the table. */
#dock{
  background:var(--felt-deep); box-shadow:inset 0 8px 10px -8px rgba(0,0,0,.55);
  overflow-x:auto; white-space:nowrap; padding:4px 8px; gap:2px; align-items:flex-end;
}
#dockLabel{font-size:15px; opacity:.9; flex:none; align-self:center; white-space:normal; max-width:7em; line-height:1.2}
#dockLabel[hidden]{display:none}
#chips{display:flex; gap:2px; flex:none; align-items:flex-end}
.heap{
  background:transparent; flex-direction:column; gap:2px; padding:2px 6px 4px;
  min-height:0; border-radius:14px; flex:none; transition:transform .15s, background .15s;
}
.heap .tag{
  font-size:14px; display:inline-flex; align-items:center; gap:6px;
  padding:2px 8px; border-radius:10px; background:rgba(0,0,0,.25);
}
.heap .tag i{width:10px; height:10px; border-radius:50%; flex:none}
.heap .tag b{opacity:.75}
.heap[aria-pressed="true"]{background:transparent; color:var(--ink); font-weight:400}
.heap[aria-pressed="true"] .tag{background:var(--chip); color:var(--chip-ink); font-weight:700}
.heap[aria-pressed="true"] canvas{filter:drop-shadow(0 0 5px var(--glow))}
.heap.target{background:rgba(242,193,78,.28); transform:scale(1.06)}
.heap.pulse{animation:pulse .45s ease-out}
@keyframes pulse{0%{transform:scale(1.12)}100%{transform:scale(1)}}

#done{position:absolute; inset:0; display:none; align-items:flex-end; justify-content:center; padding:24px; pointer-events:none; z-index:1000000}
#done.show{display:flex}
#done div{pointer-events:auto; background:var(--wood); border-radius:16px; padding:16px 20px; display:flex; gap:16px; align-items:center; font-size:22px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.4)}

dialog{
  border:0; border-radius:18px; padding:0; width:min(520px, calc(100% - 24px)); max-height:85vh;
  background:var(--wood); color:var(--ink); box-shadow:0 10px 40px rgba(0,0,0,.5);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px 20px 20px; overflow:auto; max-height:85vh}
.sheet h2{margin:0 0 8px; font-size:24px}
.sheet h3{margin:20px 0 8px; font-size:18px; opacity:.9}
.sheet p{margin:8px 0; opacity:.85}
.field{margin:12px 0}
.field label{display:flex; justify-content:space-between; gap:12px; font-size:17px}
.field output{font-weight:700; white-space:nowrap}
.field input[type=range]{width:100%; height:36px; accent-color:var(--glow)}
.toggles,.row,.sizes{display:flex; flex-wrap:wrap; gap:6px}
.row{margin-top:20px; justify-content:space-between}
input[type=file]{position:absolute; opacity:0; width:1px; height:1px}
@media (prefers-reduced-motion: reduce){
  #ghost{transition:none}
  .group.join,.group.placed.join,.heap.pulse{animation:none}
}
</style>
</head>
<body data-mode="puzzle">
<header>
  <div class="seg" role="group" aria-label="View">
    <button id="mPuzzle" aria-pressed="true">Puzzle</button>
    <button id="mSort" aria-pressed="false">Sort</button>
  </div>
  <button id="peek" class="puzzle-only" aria-pressed="false">Peek</button>
  <button id="selEdges" class="sort-only">Select edges</button>
  <button id="selNone" class="sort-only">Clear</button>
  <button id="mix">Mix</button>
  <button id="openSettings">Settings</button>
</header>
<main id="stage">
  <div id="tray"></div>
  <div id="frame"><canvas id="ghost"></canvas></div>
  <div id="empty"></div>
  <div id="done"><div><span>You finished it!</span><button id="again">Play again</button></div></div>
</main>
<nav id="dock" aria-label="Piles">
  <span id="dockLabel"></span>
  <div id="chips"></div>
</nav>

<dialog id="settings">
  <div class="sheet">
    <h2>Settings</h2>
    <h3>New puzzle</h3>
    <div class="sizes" role="group" aria-label="Number of pieces">
      <label class="btn">Choose photo<input id="file" type="file" accept="image/*"></label>
      <button data-n="12">12</button>
      <button data-n="24" aria-pressed="true">24</button>
      <button data-n="48">48</button>
      <button data-n="100">100</button>
    </div>
    <p id="info"></p>
    <h3>Snapping and shape</h3>
    <div id="sliders"></div>
    <h3>Feedback</h3>
    <div class="toggles" id="toggles"></div>
    <div class="row">
      <button id="reset">Reset to defaults</button>
      <button id="closeSettings" aria-pressed="true">Done</button>
    </div>
  </div>
</dialog>

<script>
/* ---------- Settings ---------- */

const DEFAULTS = { snapFrame: 30, snapJoin: 30, tab: 26, board: 58, sortZoom: 1.6,
  sound: true, vibrate: true, glow: true, outline: false };
let S = loadSettings();
function loadSettings(){
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('jigsaw-settings') || '{}') }; }
  catch (e) { return { ...DEFAULTS }; }
}
function saveSettings(){ try { localStorage.setItem('jigsaw-settings', JSON.stringify(S)); } catch (e) {} }

const SLIDERS = [
  { k: 'snapFrame', label: 'Snap to the frame', min: 10, max: 60, step: 5, fmt: v => v + '% of a piece' },
  { k: 'snapJoin',  label: 'Snap to other pieces', min: 10, max: 60, step: 5, fmt: v => v + '% of a piece' },
  { k: 'tab',       label: 'Tab size', min: 16, max: 34, step: 2, fmt: v => v + '% of a piece', apply: () => build(false) },
  { k: 'board',     label: 'Space for the picture', min: 40, max: 75, step: 1, fmt: v => v + '% of the screen', apply: () => build(false) },
  { k: 'sortZoom',  label: 'Piece size in Sort view', min: 1, max: 2.5, step: 0.1, fmt: v => (+v).toFixed(1) + '×', apply: () => { if (mode === 'sort') openView(); } },
];
const TOGGLES = [
  { k: 'sound', label: 'Sound' },
  { k: 'vibrate', label: 'Vibration' },
  { k: 'glow', label: 'Glow' },
  { k: 'outline', label: 'Piece outlines', apply: () => pieces.forEach(render) },
];

/* ---------- State ---------- */

const $ = id => document.getElementById(id);
const stage = $('stage'), frame = $('frame'), ghost = $('ghost'), tray = $('tray');
const done = $('done'), empty = $('empty');
const chipsEl = $('chips'), dockLabel = $('dockLabel');
const hitCtx = document.createElement('canvas').getContext('2d');
const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
const PILE_COLORS = ['#E9DCC4', '#F2C14E', '#7FC8E8', '#E8848C', '#9BD17A', '#C7A4F0', '#F0A35E'];

let img = makeDemoImage();
let count = 24;
let cut = null, geo = null;
let pieces = [], grid = [], groups = [];
let piles = [], viewing = 'unsorted', mode = 'puzzle';
let selected = new Set();
let topZ = 10;

let pileCount = 0;
// 'unsorted' is the puzzle box: it always exists. Other piles come and go.
function freshPiles(){
  pileCount = 0;
  return [{ id: 'unsorted', color: null }];
}

/* ---------- 1. Cutting ---------- */

function gridFor(n, aspect){
  const cols = Math.max(2, Math.round(Math.sqrt(n * aspect)));
  const rows = Math.max(2, Math.round(n / cols));
  return { cols, rows };
}

function cutPuzzle(image, n){
  const { cols, rows } = gridFor(n, image.width / image.height);
  const flip = () => Math.random() < 0.5 ? 1 : -1;
  const h = Array.from({length: rows - 1}, () => Array.from({length: cols}, flip));
  const v = Array.from({length: rows}, () => Array.from({length: cols - 1}, flip));
  const specs = [];
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      specs.push({
        r, c, order: Math.random(),
        top:    r > 0        ? -h[r-1][c] : 0,
        right:  c < cols - 1 ?  v[r][c]   : 0,
        bottom: r < rows - 1 ?  h[r][c]   : 0,
        left:   c > 0        ? -v[r][c-1] : 0,
      });
    }
  }
  return { cols, rows, specs };
}

function edge(P, ax, ay, bx, by, s, T){
  if (!s){ P.lineTo(bx, by); return; }
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
  const nx = dy / L, ny = -dx / L;
  const pt = (t, n) => [ax + dx*t + nx*n*T*s, ay + dy*t + ny*n*T*s];
  P.lineTo(...pt(0.35, 0));
  P.bezierCurveTo(...pt(0.40, 0),    ...pt(0.42, 0.05), ...pt(0.40, 0.08));
  P.bezierCurveTo(...pt(0.34, 0.16), ...pt(0.38, 0.26), ...pt(0.50, 0.26));
  P.bezierCurveTo(...pt(0.62, 0.26), ...pt(0.66, 0.16), ...pt(0.60, 0.08));
  P.bezierCurveTo(...pt(0.58, 0.05), ...pt(0.60, 0),    ...pt(0.65, 0));
  P.lineTo(bx, by);
}

function piecePath(p){
  const { pw, ph, pad, tabH } = geo, T = tabH / 0.26;
  const x0 = pad, y0 = pad, x1 = pad + pw, y1 = pad + ph;
  const P = new Path2D();
  P.moveTo(x0, y0);
  edge(P, x0, y0, x1, y0, p.top, T);
  edge(P, x1, y0, x1, y1, p.right, T);
  edge(P, x1, y1, x0, y1, p.bottom, T);
  edge(P, x0, y1, x0, y0, p.left, T);
  P.closePath();
  return P;
}

const isEdge = p => !p.top || !p.right || !p.bottom || !p.left;

/* ---------- 2. Layout and drawing ---------- */

function layout(){
  const W = stage.clientWidth, H = stage.clientHeight, wide = W > H, m = 16, share = S.board / 100;
  const areaW = wide ? W * share : W, areaH = wide ? H : H * share;
  const aspect = img.width / img.height;
  let bw = areaW - 2*m, bh = bw / aspect;
  if (bh > areaH - 2*m){ bh = areaH - 2*m; bw = bh * aspect; }
  const bx = (areaW - bw) / 2, by = (areaH - bh) / 2;
  const tr = wide ? { x: areaW, y: 8, w: W - areaW - 8, h: H - 16 }
                  : { x: 8, y: areaH, w: W - 16, h: H - areaH - 8 };
  const pw = bw / cut.cols, ph = bh / cut.rows;
  const tabH = Math.min(pw, ph) * S.tab / 100;
  const pad = Math.ceil(tabH) + 8;
  return { W, H, bx, by, bw, bh, tray: tr, pw, ph, pad, tabH };
}

function render(p){
  const { pw, ph, pad, bw, bh } = geo;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = pw + 2*pad, h = ph + 2*pad;
  p.cv.width = Math.round(w * dpr); p.cv.height = Math.round(h * dpr);
  p.cv.style.width = w + 'px'; p.cv.style.height = h + 'px';
  const ctx = p.cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  ctx.clip(p.path);
  ctx.drawImage(img, pad - p.c*pw, pad - p.r*ph, bw, bh);
  ctx.restore();
  if (S.outline && !(p.group && p.group.placed)){
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke(p.path);
  }
}

function home(p){ return { x: geo.bx + p.c*geo.pw - geo.pad, y: geo.by + p.r*geo.ph - geo.pad }; }
function absPos(p){ return { x: p.group.x + p.ox, y: p.group.y + p.oy }; }
function at(r, c){ return grid[r] ? grid[r][c] : undefined; }
const isSingle = g => g.pieces.length === 1 && !g.placed;
const singlesIn = id => pieces.filter(p => isSingle(p.group) && p.where === id);

/* ---------- 3. Groups ---------- */

function setGroupPos(g, x, y, s = 1){
  g.x = x; g.y = y; g.s = s;
  g.el.style.transform = `translate(${x}px, ${y}px)` + (s !== 1 ? ` scale(${s})` : '');
}

function attach(g, p, ox, oy){
  p.group = g; p.ox = ox; p.oy = oy;
  p.cv.style.transform = `translate(${ox}px, ${oy}px)`;
  g.el.appendChild(p.cv);
  g.pieces.push(p);
}

function makeGroup(x, y, items, placed){
  const el = document.createElement('div');
  el.className = 'group' + (placed ? ' placed' : '');
  el.addEventListener('animationend', () => el.classList.remove('join'));
  const g = { el, x: 0, y: 0, s: 1, pieces: [], placed };
  items.forEach(({p, ox, oy}) => attach(g, p, ox, oy));
  setGroupPos(g, x, y);
  el.style.zIndex = placed ? 1 : ++topZ;
  stage.insertBefore(el, done);
  groups.push(g);
  return g;
}

function merge(a, b){
  const q = b.pieces[0];
  a.pieces.slice().forEach(p =>
    attach(b, p, q.ox + (p.c - q.c) * geo.pw, q.oy + (p.r - q.r) * geo.ph));
  a.el.remove();
  groups = groups.filter(g => g !== a);
  return b;
}

// In Puzzle view you see: the frame, anything on the table, and the one open pile.
function isVisible(g){
  if (mode === 'sort') return isSingle(g) && g.pieces[0].where === viewing;
  return g.placed || g.pieces.length > 1 || g.pieces[0].where === 'table' || g.pieces[0].where === viewing;
}

function applyVisibility(){
  groups.forEach(g => {
    g.el.style.display = isVisible(g) ? '' : 'none';
    g.el.classList.toggle('sel', mode === 'sort' && selected.has(g.pieces[0]));
  });
}

/* ---------- 4. Piles: tipping them out onto the table ---------- */

const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function sortArea(){ return { x: 8, y: 8, w: geo.W - 16, h: geo.H - 16 }; }
function viewScale(){ return mode === 'sort' ? geo.sortS : 1; }

// Random spots with a little spacing ("best of 4 random tries"), so pieces
// land in a messy heap but don't all bury each other.
function scatterInto(list){
  if (!list.length) return;
  const s = viewScale(), area = mode === 'sort' ? sortArea() : geo.tray;
  const w = geo.pw * s, h = geo.ph * s;
  const rw = Math.max(0, area.w - w), rh = Math.max(0, area.h - h);
  const pts = singlesIn(viewing).filter(p => !list.includes(p))
    .map(p => ({ x: p.group.x + geo.pad * s, y: p.group.y + geo.pad * s }));
  shuffle(list.slice()).forEach(p => {
    let best = null, bd = -1;
    for (let i = 0; i < 4; i++){
      const x = area.x + Math.random() * rw, y = area.y + Math.random() * rh;
      let d = Infinity;
      for (const q of pts){ const dd = (q.x - x) ** 2 + (q.y - y) ** 2; if (dd < d) d = dd; }
      if (d > bd){ bd = d; best = { x, y }; }
    }
    pts.push(best);
    setGroupPos(p.group, best.x - geo.pad * s, best.y - geo.pad * s, s);
    p.group.el.style.zIndex = ++topZ;
  });
}

function updateEmpty(){
  const n = singlesIn(viewing).length;
  empty.classList.toggle('show', n === 0);
  if (n) return;
  const r = mode === 'sort' ? { x: 16, y: 24, w: geo.W - 32 } : geo.tray;
  Object.assign(empty.style, { left: r.x+'px', top: r.y+'px', width: r.w+'px' });
  empty.textContent = mode === 'sort'
    ? 'The puzzle box is empty.'
    : 'The puzzle box is empty.';
}

// Open the current pile: tip all its pieces out, in the tray or full screen.
function openView(){
  if (mode === 'sort'){
    const a = sortArea(), n = Math.max(1, singlesIn(viewing).length);
    const fw = geo.pw + 2*geo.tabH + 8, fh = geo.ph + 2*geo.tabH + 8;
    let s = Math.min(S.sortZoom, Math.sqrt(a.w * a.h * 0.7 / (n * fw * fh)));
    geo.sortS = Math.max(1, Math.min(s, a.w / fw, a.h / fh));
  } else {
    const t = geo.tray;
    Object.assign(tray.style, { left: t.x+'px', top: t.y+'px', width: t.w+'px', height: t.h+'px' });
  }
  applyVisibility();
  scatterInto(singlesIn(viewing));
  renderDock();
  updateEmpty();
}

/* ---------- 5. The pile shelf ---------- */

function drawHeap(cv, list, plus){
  const W = 92, H = 62, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  if (!list.length){
    ctx.strokeStyle = 'rgba(255,248,236,.45)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.ellipse(W/2, H/2 + 4, 32, 20, 0, 0, Math.PI*2); ctx.stroke();
    if (plus){
      ctx.fillStyle = 'rgba(255,248,236,.85)'; ctx.font = '700 28px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', W/2, H/2 + 5);
    }
    return;
  }
  const shown = list.slice().sort((a, b) => a.order - b.order)
    .slice(0, Math.min(8, 2 + Math.ceil(list.length / 3)));
  const k = 36 / Math.max(geo.pw, geo.ph);
  const w = (geo.pw + 2*geo.pad) * k, h = (geo.ph + 2*geo.pad) * k;
  shown.forEach((p, i) => {
    ctx.save();
    ctx.translate(W/2 + p.hx, H/2 + 8 + p.hy - i * 1.5);
    ctx.rotate(p.hr);
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1.5;
    ctx.drawImage(p.cv, -w/2, -h/2, w, h);
    ctx.restore();
  });
}

function renderDock(){
  const n = selected.size, moving = mode === 'sort' && n > 0;
  dockLabel.hidden = !moving;
  dockLabel.textContent = moving ? `Tap a pile to move ${n} piece${n > 1 ? 's' : ''}` : '';
  chipsEl.textContent = '';
  const make = (id, color, list, open, label) => {
    const b = document.createElement('button');
    b.className = 'heap';
    b.dataset.id = id;
    b.setAttribute('aria-pressed', !!open && !moving);
    b.setAttribute('aria-label', label);
    const cv = document.createElement('canvas');
    drawHeap(cv, open ? [] : list, id === 'new');
    b.appendChild(cv);
    if (id !== 'new'){
      const tag = document.createElement('span'); tag.className = 'tag';
      if (color){ const dot = document.createElement('i'); dot.style.background = color; tag.appendChild(dot); }
      const num = document.createElement('b'); num.textContent = list.length; tag.appendChild(num);
      b.appendChild(tag);
    }
    b.addEventListener('click', () => heapTap(id));
    chipsEl.appendChild(b);
  };
  piles.forEach((pl, i) => {
    const list = singlesIn(pl.id), open = pl.id === viewing;
    const name = pl.id === 'unsorted' ? 'Puzzle box' : `Pile ${i}`;
    make(pl.id, pl.color, list, open, `${name}, ${list.length} pieces${open ? ', open' : ''}`);
  });
  make('new', null, [], false, 'Drop pieces here to start a new pile');
}

function heapEl(id){ return chipsEl.querySelector(`.heap[data-id="${id}"]`); }
function pulseHeap(id){
  const c = heapEl(id); if (!c) return;
  c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
}

function heapTap(id){
  if (mode === 'sort' && selected.size){ moveToPile([...selected], id); return; }
  if (id === 'new' || id === viewing) return;
  viewing = id;
  selected.clear();
  openView();
}

// Remove piles that have run out of pieces. The puzzle box always stays.
function prune(){
  piles = piles.filter(pl => pl.id === 'unsorted' || singlesIn(pl.id).length > 0);
  if (!piles.some(pl => pl.id === viewing)){
    viewing = 'unsorted';
    selected.clear();
    openView();
  }
}

function moveToPile(list, id){
  if (id === 'new'){
    id = 'p' + Date.now();
    piles.push({ id, color: PILE_COLORS[1 + (pileCount++ % (PILE_COLORS.length - 1))] });
  }
  const incoming = [];
  list.forEach(p => { p.where = id; selected.delete(p); if (id === viewing) incoming.push(p); });
  applyVisibility();
  scatterInto(incoming);
  prune();
  renderDock();
  updateEmpty();
  pulseHeap(id);
  if (S.vibrate && navigator.vibrate) navigator.vibrate(15);
  chime([880]);
}

/* ---------- 6. Build or rebuild ---------- */

function build(fresh){
  let saved = null;
  if (!fresh && geo){
    saved = groups.map(g => ({
      placed: g.placed, keys: g.pieces.map(p => [p.r, p.c, p.where]),
      nx: (g.x + geo.pad) / geo.W, ny: (g.y + geo.pad) / geo.H,
    }));
  }
  if (fresh){
    cut = cutPuzzle(img, count);
    piles = freshPiles(); viewing = 'unsorted';
    setMode('puzzle', true);
  }
  selected.clear();
  geo = layout();

  Object.assign(frame.style, { left: geo.bx+'px', top: geo.by+'px', width: geo.bw+'px', height: geo.bh+'px' });
  ghost.width = Math.round(geo.bw); ghost.height = Math.round(geo.bh);
  ghost.getContext('2d').drawImage(img, 0, 0, ghost.width, ghost.height);

  groups.forEach(g => g.el.remove());
  groups = [];
  grid = Array.from({length: cut.rows}, () => []);
  pieces = cut.specs.map(s => {
    const cv = document.createElement('canvas');
    cv.className = 'piece';
    const p = { ...s, cv, where: 'unsorted',
      hx: (Math.random() - .5) * 24, hy: (Math.random() - .5) * 10, hr: (Math.random() - .5) * 1.3 };
    cv._p = p;
    p.path = piecePath(p);
    grid[s.r][s.c] = p;
    return p;
  });

  const sets = saved || pieces.map(p => ({ placed: false, keys: [[p.r, p.c, 'unsorted']], nx: null }));
  for (const s of sets){
    const list = s.keys.map(([r, c, w]) => { const p = grid[r][c]; p.where = w; return p; });
    const p0 = list[0];
    const items = list.map(p => ({ p, ox: (p.c - p0.c) * geo.pw, oy: (p.r - p0.r) * geo.ph }));
    let x = 0, y = 0;
    if (s.placed){ const h = home(p0); x = h.x; y = h.y; }
    else if (s.nx !== null){ x = s.nx * geo.W - geo.pad; y = s.ny * geo.H - geo.pad; }
    makeGroup(x, y, items, s.placed);
  }
  pieces.forEach(render);

  $('info').textContent = `Current puzzle: ${cut.cols * cut.rows} pieces (${cut.cols} × ${cut.rows}).`;
  done.classList.toggle('show', groups.every(g => g.placed));
  openView();
}

function setMode(m, quiet){
  mode = m;
  document.body.dataset.mode = m;
  $('mPuzzle').setAttribute('aria-pressed', m === 'puzzle');
  $('mSort').setAttribute('aria-pressed', m === 'sort');
  selected.clear();
  if (!quiet) openView();
}

/* ---------- 7. Feedback ---------- */

let actx = null;
function ensureAudio(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}

function chime(notes){
  if (!actx || !S.sound) return;
  notes.forEach((f, i) => {
    const t = actx.currentTime + i * 0.09;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(gn).connect(actx.destination);
    o.start(t); o.stop(t + 0.35);
  });
}

function celebrate(g, kind){
  if (S.glow){
    g.el.classList.remove('join'); void g.el.offsetWidth; g.el.classList.add('join');
  }
  if (S.vibrate && navigator.vibrate) navigator.vibrate(kind === 'join' ? 25 : [20, 40, 20]);
  chime(kind === 'join' ? [659.25] : [523.25, 783.99]);
}

/* ---------- 8. Touch: drag in both views, tap to select in Sort view ---------- */

let drag = null, hoverHeap = null;

function pick(lx, ly){
  const loose = groups.filter(g => !g.placed && g.el.style.display !== 'none')
    .sort((a, b) => b.el.style.zIndex - a.el.style.zIndex);
  return loose.find(g => g.pieces.some(p =>
    hitCtx.isPointInPath(p.path, (lx - g.x) / g.s - p.ox, (ly - g.y) / g.s - p.oy))) || null;
}

function heapAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('#chips .heap[data-id]') : null;
}

function toggleSelect(p){
  if (selected.has(p)) selected.delete(p); else selected.add(p);
  p.group.el.classList.toggle('sel', selected.has(p));
  renderDock();
}

stage.addEventListener('pointerdown', e => {
  ensureAudio();
  if (drag) return;
  const r = stage.getBoundingClientRect();
  const lx = e.clientX - r.left, ly = e.clientY - r.top;
  const g = pick(lx, ly);
  if (!g) return;
  const s = g.s, xs = g.pieces.map(p => p.ox), ys = g.pieces.map(p => p.oy);
  drag = {
    g, id: e.pointerId, r, ox: lx - g.x, oy: ly - g.y, sx: lx, sy: ly, moved: false,
    minX: -(geo.pad + Math.min(...xs)) * s, maxX: geo.W - (geo.pw + geo.pad + Math.max(...xs)) * s,
    minY: -(geo.pad + Math.min(...ys)) * s, maxY: geo.H - (geo.ph + geo.pad + Math.max(...ys)) * s,
  };
  g.el.style.zIndex = ++topZ;
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag, lx = e.clientX - d.r.left, ly = e.clientY - d.r.top;
  if (!d.moved){
    if (Math.hypot(lx - d.sx, ly - d.sy) < 8) return;
    d.moved = true;
    d.g.el.classList.add('lifted');
  }
  const x = Math.min(Math.max(lx - d.ox, d.minX), Math.max(d.minX, d.maxX));
  const y = Math.min(Math.max(ly - d.oy, d.minY), Math.max(d.minY, d.maxY));
  setGroupPos(d.g, x, y, d.g.s);
  const h = d.g.pieces.length === 1 ? heapAt(e.clientX, e.clientY) : null;
  if (h !== hoverHeap){
    if (hoverHeap) hoverHeap.classList.remove('target');
    hoverHeap = h;
    if (h) h.classList.add('target');
  }
});

function drop(e){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  let g = d.g;
  g.el.classList.remove('lifted');
  if (hoverHeap){ hoverHeap.classList.remove('target'); hoverHeap = null; }

  // A tap, not a drag.
  if (!d.moved){
    if (mode === 'sort') toggleSelect(g.pieces[0]);
    return;
  }

  // Dropped on a pile: add it (and, in Sort view, everything selected with it).
  const heap = g.pieces.length === 1 ? heapAt(e.clientX, e.clientY) : null;
  if (heap){
    const p = g.pieces[0];
    const list = mode === 'sort' && selected.has(p) ? [...selected] : [p];
    moveToPile(list, heap.dataset.id);
    return;
  }
  if (mode === 'sort') return;

  const T = Math.min(geo.pw, geo.ph);
  const snapFrame = Math.max(12, T * S.snapFrame / 100);
  const snapJoin  = Math.max(12, T * S.snapJoin / 100);

  // Close to its spot in the frame: lock the whole group in place.
  const nearHome = g.pieces.some(p => {
    const a = absPos(p), h = home(p);
    return Math.hypot(a.x - h.x, a.y - h.y) < snapFrame;
  });
  if (nearHome){
    const p0 = g.pieces[0], h = home(p0);
    setGroupPos(g, h.x - p0.ox, h.y - p0.oy);
    g.placed = true;
    g.pieces.forEach(p => { p.where = 'table'; render(p); });
    g.el.classList.add('placed');
    g.el.style.zIndex = 1;
    celebrate(g, 'place');
    prune(); renderDock(); updateEmpty();
    if (groups.every(q => q.placed)){
      done.classList.add('show');
      setTimeout(() => chime([523.25, 659.25, 783.99, 1046.5]), 250);
    }
    return;
  }

  // Close to a visible matching neighbour: join them.
  let joined = false, again = true;
  while (again){
    again = false;
    for (const p of g.pieces){
      for (const [dr, dc] of DIRS){
        const n = at(p.r + dr, p.c + dc);
        if (!n || n.group === g || n.group.placed || !isVisible(n.group)) continue;
        const a = absPos(p), b = absPos(n);
        const tx = b.x - dc * geo.pw, ty = b.y - dr * geo.ph;
        if (Math.hypot(a.x - tx, a.y - ty) < snapJoin){
          setGroupPos(g, g.x + tx - a.x, g.y + ty - a.y);
          g = merge(g, n.group);
          joined = again = true;
          break;
        }
      }
      if (again) break;
    }
  }
  if (joined){
    g.pieces.forEach(p => p.where = 'table');
    g.el.style.zIndex = ++topZ;
    celebrate(g, 'join');
  } else if (g.pieces.length === 1){
    // Inside the tray: stays in the open pile. Elsewhere: it's on the table.
    const t = geo.tray, cx = g.x + geo.pad + geo.pw / 2, cy = g.y + geo.pad + geo.ph / 2;
    const inTray = cx >= t.x && cx <= t.x + t.w && cy >= t.y && cy <= t.y + t.h;
    g.pieces[0].where = inTray ? viewing : 'table';
  }
  prune();
  renderDock();
  updateEmpty();
}
stage.addEventListener('pointerup', drop);
stage.addEventListener('pointercancel', drop);

/* ---------- 9. Sort view buttons ---------- */

$('selEdges').addEventListener('click', () => {
  singlesIn(viewing).filter(isEdge).forEach(p => selected.add(p));
  applyVisibility(); renderDock();
});
$('selNone').addEventListener('click', () => { selected.clear(); applyVisibility(); renderDock(); });
$('mix').addEventListener('click', () => { scatterInto(singlesIn(viewing)); chime([440, 494]); });

/* ---------- 10. Header and settings ---------- */

$('mPuzzle').addEventListener('click', () => setMode('puzzle'));
$('mSort').addEventListener('click', () => setMode('sort'));

$('peek').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on);
  frame.classList.toggle('peek', on);
});

const dlg = $('settings');
$('openSettings').addEventListener('click', () => dlg.showModal());
$('closeSettings').addEventListener('click', () => dlg.close());

document.querySelectorAll('.sizes button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.sizes button').forEach(x => x.setAttribute('aria-pressed', x === b));
  count = +b.dataset.n;
  build(true);
  dlg.close();
}));

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const i = new Image();
  i.onload = () => { img = i; build(true); dlg.close(); };
  i.src = URL.createObjectURL(f);
});

function buildSettingsUI(){
  const box = $('sliders'); box.textContent = '';
  SLIDERS.forEach(d => {
    const wrap = document.createElement('div'); wrap.className = 'field';
    const lab = document.createElement('label'); lab.htmlFor = 's-' + d.k;
    const out = document.createElement('output'); out.textContent = d.fmt(S[d.k]);
    lab.append(document.createTextNode(d.label), out);
    const inp = document.createElement('input');
    Object.assign(inp, { type: 'range', id: 's-' + d.k, min: d.min, max: d.max, step: d.step, value: S[d.k] });
    inp.addEventListener('input', () => { S[d.k] = +inp.value; out.textContent = d.fmt(S[d.k]); saveSettings(); });
    inp.addEventListener('change', () => { if (d.apply) d.apply(); });
    wrap.append(lab, inp); box.appendChild(wrap);
  });
  const tb = $('toggles'); tb.textContent = '';
  TOGGLES.forEach(d => {
    const b = document.createElement('button');
    b.textContent = d.label; b.setAttribute('aria-pressed', S[d.k]);
    b.addEventListener('click', () => {
      S[d.k] = !S[d.k]; b.setAttribute('aria-pressed', S[d.k]); saveSettings();
      if (d.apply) d.apply();
    });
    tb.appendChild(b);
  });
}

$('reset').addEventListener('click', () => {
  S = { ...DEFAULTS }; saveSettings(); buildSettingsUI(); build(false);
});

$('again').addEventListener('click', () => build(true));

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => build(false), 200);
});

/* ---------- Demo picture ---------- */

function makeDemoImage(){
  const W = 1600, H = 1200, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#5FA8D9'); sky.addColorStop(1, '#F8D7A0');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = '#FFE38A'; g.beginPath(); g.arc(1180, 300, 110, 0, Math.PI*2); g.fill();
  const ridge = (base, amp, f, color, seed) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 10){
      const y = base - amp * (Math.sin(x*f + seed) * 0.6 + Math.sin(x*f*2.3 + seed*2) * 0.4);
      g.lineTo(x, y);
    }
    g.lineTo(W, H); g.fill();
  };
  ridge(560, 140, 0.004, '#7E8FB8', 1);
  ridge(640, 90, 0.006, '#4E7A6A', 3);
  g.fillStyle = '#3F7FB0'; g.fillRect(0, 700, W, 160);
  ridge(900, 50, 0.008, '#6BA34E', 5);
  ridge(1000, 30, 0.01, '#4F8A3A', 7);
  const house = (x, y, body, roof) => {
    g.fillStyle = body; g.fillRect(x, y, 160, 120);
    g.fillStyle = roof; g.beginPath(); g.moveTo(x-20, y); g.lineTo(x+80, y-80); g.lineTo(x+180, y); g.fill();
    g.fillStyle = '#FFF4D6'; g.fillRect(x+25, y+35, 35, 35); g.fillRect(x+100, y+35, 35, 35);
  };
  house(300, 860, '#C8443A', '#3A3A3A');
  house(560, 880, '#F2C14E', '#2F4A6A');
  house(1100, 870, '#F4F0E6', '#B0402E');
  const dots = ['#E8505B', '#FFFFFF', '#F2C14E', '#B07CE8'];
  for (let i = 0; i < 260; i++){
    g.fillStyle = dots[i % dots.length];
    g.beginPath(); g.arc(Math.random()*W, 1020 + Math.random()*170, 6 + Math.random()*6, 0, Math.PI*2); g.fill();
  }
  return c;
}

buildSettingsUI();
build(true);

// Offline support: lets the app open and run without internet after the first visit.
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Offline mode unavailable:', err));
  });
}
