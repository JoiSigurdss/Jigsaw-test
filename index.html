<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Púsla</title>
<meta name="theme-color" content="#4A3426">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Atkinson Hyperlegible'; font-weight:400; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible'; font-weight:700; font-display:swap;
  src:url('fonts/atkinson-hyperlegible-latin-700-normal.woff2') format('woff2')}
:root{
  --bar:#4A3426; --btn:#2E211A; --table:#7A6656; --slot:#4F4037; --tray:#5B7D5F; --shelf:#2F4A3C;
  --ink:#FFF8EC; --chip:#F0E4CC; --chip-ink:#3A2A1C; --glow:#F2C14E; --panel:#6E4B32; --panel-hi:#8A6244;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bar:#33241A; --btn:#1F1611; --table:#54463B; --slot:#352B25; --tray:#3F5A44; --shelf:#22362C;
    --panel:#4A3222; --panel-hi:#624430; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bar:#33241A; --btn:#1F1611; --table:#54463B; --slot:#352B25; --tray:#3F5A44; --shelf:#22362C;
  --panel:#4A3222; --panel-hi:#624430; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%; margin:0}
body{
  background:var(--bar); color:var(--ink);
  font-family:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button,.btn{
  min-height:48px; padding:0 16px; border:0; border-radius:12px;
  background:var(--panel-hi); color:var(--ink); font:inherit; font-size:18px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
}
button:focus-visible,.btn:focus-within{outline:3px solid var(--glow); outline-offset:2px}
button[aria-pressed="true"]{background:var(--chip); color:var(--chip-ink); font-weight:700}

/* Top bar: icon buttons only */
#bar{background:var(--bar); display:flex; align-items:center; gap:10px; padding:10px 12px; box-shadow:0 2px 8px rgba(0,0,0,.35); position:relative; z-index:2}
#bar .spacer{flex:1}
.icon{width:52px; height:52px; padding:0; border-radius:14px; background:var(--btn)}
.icon svg{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.icon[aria-pressed="true"]{background:var(--chip); color:var(--chip-ink)}
.icon[hidden]{display:none}
body[data-mode="sort"] .puzzle-only{display:none}
body[data-screen="home"] .game{display:none !important}
body[data-screen="game"] #home{display:none}

/* Puzzle selection screen */
#home{flex:1; display:flex; flex-direction:column; min-height:0; background:var(--shelf)}
.homebar{background:var(--bar); display:flex; align-items:center; gap:10px; padding:10px 12px 10px 18px; box-shadow:0 2px 8px rgba(0,0,0,.35); position:relative; z-index:2}
.homebar h1{margin:0; font-size:26px; flex:1}
#cats{display:flex; gap:8px; overflow-x:auto; padding:12px; flex:none}
#cats button{border-radius:24px; flex:none; background:var(--btn)}
#cats button[aria-pressed="true"]{background:var(--chip)}
#gridWrap{flex:1; overflow-y:auto; padding:0 12px 24px}
#grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:900px; margin:0 auto}
.card{display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; padding:0; gap:0; min-height:0; border-radius:14px; overflow:hidden; background:var(--bar); text-align:left; position:relative; font-weight:400}
.card .thumb{display:block; aspect-ratio:4/3; width:100%; background:var(--slot) center/cover no-repeat}
.card .name{padding:8px 10px 10px; font-size:16px; line-height:1.25}
.card .badge{position:absolute; top:8px; left:8px; background:var(--chip); color:var(--chip-ink); font-weight:700; font-size:14px; padding:3px 9px; border-radius:10px}
.card.add .thumb{display:flex; align-items:center; justify-content:center; font-size:46px; background:transparent; border:2px dashed rgba(255,248,236,.4); border-radius:14px 14px 0 0}
.card.broken .thumb{opacity:.35}
#homeMsg{text-align:center; opacity:.85; font-size:17px; max-width:600px; margin:16px auto}
#pickImg{display:block; width:100%; max-height:38vh; object-fit:contain; border-radius:10px; background:var(--slot)}
#pickResume{margin:10px 0}
#pickResume[hidden]{display:none}
#pickContinue{width:100%}
#file{position:absolute; opacity:0; width:1px; height:1px}
.card .new{position:absolute; top:8px; right:8px; background:var(--glow); color:#3A2A1C; font-weight:700; font-size:14px; padding:3px 9px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,.35)}
#cats button.hasnew::after{content:''; width:9px; height:9px; border-radius:50%; background:var(--glow); margin-left:2px}
#refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ #refresh.spin svg{animation:none} }

#dockLabel{font-size:15px; opacity:.95; flex:none; align-self:center; white-space:normal; width:6.5em; line-height:1.25; padding-right:4px}
#dockLabel[hidden]{display:none}

#stage{position:relative; flex:1; overflow:hidden; background:var(--table)}
#view{position:absolute; left:0; top:0; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
#toast, .toast{
  position:absolute; left:50%; top:12px; transform:translateX(-50%);
  background:var(--panel); padding:10px 16px; border-radius:12px; font-size:17px;
  box-shadow:0 4px 14px rgba(0,0,0,.35); opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%; text-align:center;
}
#toast.show, .toast.show{opacity:1}
#home{position:relative}
#homeToast{top:auto; bottom:24px}
#done{position:absolute; left:0; right:0; top:0; display:none; align-items:flex-end; justify-content:center; padding:16px; pointer-events:none}
#done.show{display:flex}
#done div{pointer-events:auto; background:var(--panel); border-radius:16px; padding:14px 18px; display:flex; gap:16px; align-items:center; font-size:22px; font-weight:700; box-shadow:0 6px 20px rgba(0,0,0,.4)}

/* Pile shelf */
#dock{background:var(--shelf); display:flex; gap:4px; overflow-x:auto; padding:6px 8px 4px; scroll-snap-type:x proximity}
#chips{display:flex; gap:4px; align-items:flex-end; flex:none}
.heap{background:transparent; flex-direction:column; gap:2px; padding:2px 4px 4px; min-height:0; border-radius:14px; flex:none; transition:transform .15s, background .15s; scroll-snap-align:start}
.heap .tag{font-size:15px; display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:10px; background:rgba(0,0,0,.3)}
.heap .tag i{width:10px; height:10px; border-radius:50%; flex:none}
.heap[aria-pressed="true"]{background:rgba(255,255,255,.08); color:var(--ink); font-weight:400}
.heap[aria-pressed="true"] .tag{background:var(--chip); color:var(--chip-ink); font-weight:700}
.heap.target{background:rgba(242,193,78,.3); transform:scale(1.06)}
.heap.pulse{animation:pulse .45s ease-out}
@keyframes pulse{0%{transform:scale(1.12)}100%{transform:scale(1)}}

dialog{border:0; border-radius:18px; padding:0; width:min(520px, calc(100% - 24px)); max-height:85vh; background:var(--panel); color:var(--ink); box-shadow:0 10px 40px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:18px 20px 20px; overflow:auto; max-height:85vh}
.sheet h2{margin:0 0 8px; font-size:24px}
.sheet h3{margin:20px 0 8px; font-size:18px; opacity:.9}
.sheet p{margin:8px 0; opacity:.85}
.field{margin:12px 0}
.field label{display:flex; justify-content:space-between; gap:12px; font-size:17px}
.field output{font-weight:700; white-space:nowrap}
.field input[type=range]{width:100%; height:36px; accent-color:var(--glow)}
.toggles,.row,.sizes{display:flex; flex-wrap:wrap; gap:6px}
.row{margin-top:20px; justify-content:space-between}
input[type=file]{position:absolute; opacity:0; width:1px; height:1px}
@media (prefers-reduced-motion: reduce){ .heap.pulse{animation:none} #toast{transition:none} }
</style>
</head>
<body data-mode="puzzle" data-screen="home">
<section id="home">
  <header class="homebar">
    <h1>Púsla</h1>
    <button id="refresh" class="icon" aria-label="Check for new puzzles" title="Check for new puzzles">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button id="homeSettings" class="icon" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <nav id="cats" aria-label="Categories"></nav>
  <div id="gridWrap"><div id="grid"></div><p id="homeMsg" hidden></p></div>
  <input id="file" type="file" accept="image/*">
  <div id="homeToast" class="toast" role="status"></div>
</section>
<header id="bar" class="game">
  <button id="back" class="icon" aria-label="Back to puzzles" title="Back to puzzles">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button id="mode" class="icon" aria-label="Sorting mode" title="Sorting mode" aria-pressed="false">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
  </button>
  <div class="spacer"></div>
  <button id="peek" class="icon puzzle-only" aria-label="Peek at the picture" title="Peek at the picture" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button id="edges" class="icon" aria-label="Gather edge pieces into a pile" title="Gather edge pieces">
    <svg viewBox="0 0 24 24"><path d="M4 10V4h6M14 4h6v6M20 14v6h-6M10 20H4v-6"/></svg>
  </button>
  <button id="fit" class="icon puzzle-only" aria-label="Show the whole board" title="Show the whole board">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21M8 11h6"/></svg>
  </button>
  <button id="openSettings" class="icon" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>
<main id="stage" class="game">
  <canvas id="view"></canvas>
  <div id="toast" role="status"></div>
  <div id="done"><div><span>You finished it!</span><button id="doneHome">More puzzles</button></div></div>
</main>
<nav id="dock" class="game" aria-label="Piles"><span id="dockLabel" hidden></span><div id="chips"></div></nav>

<dialog id="settings">
  <div class="sheet">
    <h2>Settings</h2>
    <p id="info"></p>
    <h3>Pieces and snapping</h3>
    <div id="sliders"></div>
    <h3>Feedback and graphics</h3>
    <div class="toggles" id="toggles"></div>
    <div class="row">
      <button id="reset">Reset settings</button>
      <button id="closeSettings" aria-pressed="true">Done</button>
    </div>
  </div>
</dialog>

<dialog id="pick">
  <div class="sheet">
    <img id="pickImg" alt="">
    <h2 id="pickName"></h2>
    <div id="pickResume"><button id="pickContinue" aria-pressed="true">Continue</button></div>
    <p id="pickLabel">How many pieces?</p>
    <div class="sizes" id="pickCounts" role="group" aria-label="Number of pieces">
      <button data-n="24">24</button>
      <button data-n="48">48</button>
      <button data-n="100">100</button>
      <button data-n="200">200</button>
      <button data-n="400">400</button>
    </div>
    <div class="row"><span></span><button id="pickCancel">Cancel</button></div>
  </div>
</dialog>

<script>

'use strict';
const $ = id => document.getElementById(id);

/* =====================================================================
   1. Settings
   ===================================================================== */

const DEFAULTS = {
  snapFrame: 30, snapJoin: 30, tab: 26, trayCount: 30, traySize: 64, sortSize: 88, lastCount: 100,
  sound: true, vibrate: true, glow: true, outline: false,
  sharp: !(navigator.deviceMemory && navigator.deviceMemory <= 4),
};
let S = loadSettings();
function loadSettings(){
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('jigsaw-settings') || '{}') }; }
  catch (e) { return { ...DEFAULTS }; }
}
function saveSettings(){ try { localStorage.setItem('jigsaw-settings', JSON.stringify(S)); } catch (e) {} }

const SLIDERS = [
  { k: 'trayCount', label: 'Pieces out of the box', min: 10, max: 80, step: 5, fmt: v => v + ' pieces', apply: () => afterChange() },
  { k: 'traySize',  label: 'Piece size in the pieces area', min: 40, max: 120, step: 4, fmt: v => v + ' px', apply: () => { layoutTray(); invalidate(); } },
  { k: 'sortSize',  label: 'Piece size when sorting', min: 48, max: 160, step: 4, fmt: v => v + ' px', apply: () => { layoutTray(); invalidate(); } },
  { k: 'snapFrame', label: 'Snap to the board', min: 10, max: 60, step: 5, fmt: v => v + '% of a piece' },
  { k: 'snapJoin',  label: 'Snap to other pieces', min: 10, max: 60, step: 5, fmt: v => v + '% of a piece' },
  { k: 'tab',       label: 'Tab size', min: 16, max: 34, step: 2, fmt: v => v + '% of a piece', apply: () => { rebuildGraphics(); afterChange(); } },
];
const TOGGLES = [
  { k: 'sound', label: 'Sound' },
  { k: 'vibrate', label: 'Vibration' },
  { k: 'glow', label: 'Glow' },
  { k: 'outline', label: 'Piece outlines', apply: () => { rebuildGraphics(); afterChange(); } },
  { k: 'sharp', label: 'Sharp graphics', apply: () => resizeCanvas() },
];

/* =====================================================================
   2. State
   ===================================================================== */

const stage = $('stage'), view = $('view'), vctx = view.getContext('2d');
const chipsEl = $('chips');
const hitCtx = document.createElement('canvas').getContext('2d');
const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
const PILE_COLORS = ['#F2C14E', '#7FC8E8', '#E8848C', '#9BD17A', '#C7A4F0', '#F0A35E'];

let img = null, P = null;
let pieces = [], grid = [];
let items = [];               // every unplaced group, back to front
let boardCanvas = null;       // placed pieces are painted into this
let piles = [], pileCount = 0;
let source = 'box';           // what the pieces area shows: 'box' or a pile id
let trayList = [];            // pieces shown in the pieces area, back to front
let trayK = 1;                // screen px per picture px in the pieces area
let cam = { x: 0, y: 0, s: 1 };
let peek = false, colors = {};
let mode = 'puzzle';           // 'puzzle' or 'sort'
let selected = new Set();       // pieces picked in sorting mode

// Where a piece is ("where"):
//   'box'    in the box, out of sight
//   'tray'   out of the box, lying in the pieces area
//   'board'  lying loose on the board area (or joined into a group)
//   'placed' locked into the picture
//   'p…'     in one of your piles

/* =====================================================================
   3. Cutting
   ===================================================================== */

function rng(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function gridFor(n, aspect){
  const cols = Math.max(2, Math.round(Math.sqrt(n * aspect)));
  const rows = Math.max(2, Math.round(n / cols));
  return { cols, rows };
}

function makePuzzle(seed, count, cols, rows){
  const R = rng(seed), flip = () => R() < 0.5 ? 1 : -1;
  const h = Array.from({length: rows - 1}, () => Array.from({length: cols}, flip));
  const v = Array.from({length: rows}, () => Array.from({length: cols - 1}, flip));
  P = { seed, count, cols, rows, W: img.width, H: img.height };
  P.pw = P.W / cols; P.ph = P.H / rows;
  pieces = []; grid = Array.from({length: rows}, () => []);
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const p = {
        i: r * cols + c, r, c, where: 'box', placed: false, touched: false, group: null,
        top:    r > 0        ? -h[r-1][c] : 0,
        right:  c < cols - 1 ?  v[r][c]   : 0,
        bottom: r < rows - 1 ?  h[r][c]   : 0,
        left:   c > 0        ? -v[r][c-1] : 0,
        hx: (R() - .5) * 24, hy: (R() - .5) * 10, hr: (R() - .5) * 1.3,
      };
      pieces.push(p); grid[r][c] = p;
    }
  }
}


const at = (r, c) => grid[r] ? grid[r][c] : undefined;
const isEdge = p => !p.top || !p.right || !p.bottom || !p.left;

/* =====================================================================
   4. Graphics
   ===================================================================== */

function edge(Pth, ax, ay, bx, by, s, T){
  if (!s){ Pth.lineTo(bx, by); return; }
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy);
  const nx = dy / L, ny = -dx / L;
  const pt = (t, n) => [ax + dx*t + nx*n*T*s, ay + dy*t + ny*n*T*s];
  Pth.lineTo(...pt(0.35, 0));
  Pth.bezierCurveTo(...pt(0.40, 0),    ...pt(0.42, 0.05), ...pt(0.40, 0.08));
  Pth.bezierCurveTo(...pt(0.34, 0.16), ...pt(0.38, 0.26), ...pt(0.50, 0.26));
  Pth.bezierCurveTo(...pt(0.62, 0.26), ...pt(0.66, 0.16), ...pt(0.60, 0.08));
  Pth.bezierCurveTo(...pt(0.58, 0.05), ...pt(0.60, 0),    ...pt(0.65, 0));
  Pth.lineTo(bx, by);
}

// Path in the piece's own sprite coordinates (the picture area starts at pad, pad).
function piecePath(p){
  const { pw, ph, pad, tabH } = P, T = tabH / 0.26;
  const x0 = pad, y0 = pad, x1 = pad + pw, y1 = pad + ph;
  const Pth = new Path2D();
  Pth.moveTo(x0, y0);
  edge(Pth, x0, y0, x1, y0, p.top, T);
  edge(Pth, x1, y0, x1, y1, p.right, T);
  edge(Pth, x1, y1, x0, y1, p.bottom, T);
  edge(Pth, x0, y1, x0, y0, p.left, T);
  Pth.closePath();
  return Pth;
}

// Copy the picture area under a piece (clipped by whatever clip is active).
function drawImageRegion(ctx, x0, y0, w, h, dx, dy){
  let sx = x0, sy = y0, ox = dx, oy = dy, sw = w, sh = h;
  if (sx < 0){ ox -= sx; sw += sx; sx = 0; }
  if (sy < 0){ oy -= sy; sh += sy; sy = 0; }
  sw = Math.min(sw, P.W - sx); sh = Math.min(sh, P.H - sy);
  if (sw > 0 && sh > 0) ctx.drawImage(img, sx, sy, sw, sh, ox, oy, sw, sh);
}

let sheets = [];
function buildSprites(){
  const sw = Math.ceil(P.pw + 2 * P.pad), sh = Math.ceil(P.ph + 2 * P.pad);
  const SHEET = 2048;
  const perRow = Math.max(1, Math.floor(SHEET / sw));
  const perSheet = perRow * Math.max(1, Math.floor(SHEET / sh));
  sheets = [];
  const T = Math.min(P.pw, P.ph);
  pieces.forEach((p, k) => {
    const si = Math.floor(k / perSheet), j = k % perSheet;
    if (!sheets[si]){
      const n = Math.min(perSheet, pieces.length - si * perSheet);
      const c = document.createElement('canvas');
      c.width = Math.min(perRow, n) * sw; c.height = Math.ceil(n / perRow) * sh;
      sheets[si] = c;
    }
    p.sp = { c: sheets[si], x: (j % perRow) * sw, y: Math.floor(j / perRow) * sh, w: sw, h: sh };
    const ctx = sheets[si].getContext('2d');
    ctx.save();
    ctx.translate(p.sp.x, p.sp.y);
    ctx.beginPath(); ctx.rect(0, 0, sw, sh); ctx.clip();
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = T * .05; ctx.shadowOffsetY = T * .02;
    ctx.fillStyle = '#000'; ctx.fill(p.path);
    ctx.restore();
    ctx.save(); ctx.clip(p.path);
    drawImageRegion(ctx, p.c * P.pw - P.pad, p.r * P.ph - P.pad, sw, sh, 0, 0);
    ctx.restore();
    if (S.outline){ ctx.lineWidth = Math.max(1, T * .015); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.stroke(p.path); }
    ctx.restore();
  });
}

// A joined group is drawn as one image, so 30 joined pieces cost the same as 1.
function buildGroupImage(g){
  if (g.pieces.length === 1){ g.sp = null; return; }
  let minC = Infinity, maxC = -1, minR = Infinity, maxR = -1;
  g.pieces.forEach(p => { minC = Math.min(minC, p.c); maxC = Math.max(maxC, p.c); minR = Math.min(minR, p.r); maxR = Math.max(maxR, p.r); });
  const ox = minC * P.pw - P.pad, oy = minR * P.ph - P.pad;
  const w = Math.ceil((maxC - minC + 1) * P.pw + 2 * P.pad), h = Math.ceil((maxR - minR + 1) * P.ph + 2 * P.pad);
  const U = new Path2D();
  g.pieces.forEach(p => U.addPath(p.path, new DOMMatrix([1, 0, 0, 1, p.c * P.pw - P.pad - ox, p.r * P.ph - P.pad - oy])));
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const t = tmp.getContext('2d');
  t.save(); t.clip(U); drawImageRegion(t, ox, oy, w, h, 0, 0); t.restore();
  const T = Math.min(P.pw, P.ph);
  if (S.outline){ t.lineWidth = Math.max(1, T * .015); t.strokeStyle = 'rgba(255,255,255,.6)'; t.stroke(U); }
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d');
  o.shadowColor = 'rgba(0,0,0,.45)'; o.shadowBlur = T * .05; o.shadowOffsetY = T * .02;
  o.drawImage(tmp, 0, 0);
  g.sp = { c: out, x: 0, y: 0, w, h };
  g.ox = ox; g.oy = oy;
  g.bbox = { minC, maxC, minR, maxR };
}

function paintPlaced(list){
  const ctx = boardCanvas.getContext('2d');
  list.forEach(p => {
    const x = p.c * P.pw - P.pad, y = p.r * P.ph - P.pad;
    ctx.save(); ctx.translate(x, y); ctx.clip(p.path);
    drawImageRegion(ctx, x, y, p.sp.w, p.sp.h, 0, 0);
    ctx.restore();
  });
}


function rebuildGraphics(){
  P.tabH = Math.min(P.pw, P.ph) * S.tab / 100;
  P.pad = Math.ceil(P.tabH + Math.min(P.pw, P.ph) * .09 + 3);
  P.sw = Math.ceil(P.pw + 2 * P.pad); P.sh = Math.ceil(P.ph + 2 * P.pad);
  pieces.forEach(p => p.path = piecePath(p));
  buildSprites();
  items.forEach(g => { if (!isSingle(g)) buildGroupImage(g); });
  boardCanvas = document.createElement('canvas');
  boardCanvas.width = P.W; boardCanvas.height = P.H;
  paintPlaced(pieces.filter(p => p.placed));
  computeWorld();
  layoutTray();
  invalidate();
}

/* =====================================================================
   5. Groups (on the board)
   ===================================================================== */

// A group's position (gx, gy) is where the picture's top-left corner would be.
// Each piece sits at (gx + c*pw, gy + r*ph). At (0, 0) it is home.
function makeGroup(list, gx, gy){
  const g = { pieces: list, gx, gy, sp: null };
  list.forEach(p => p.group = g);
  updateBBox(g);
  return g;
}
function updateBBox(g){
  let minC = Infinity, maxC = -1, minR = Infinity, maxR = -1;
  g.pieces.forEach(p => { minC = Math.min(minC, p.c); maxC = Math.max(maxC, p.c); minR = Math.min(minR, p.r); maxR = Math.max(maxR, p.r); });
  g.bbox = { minC, maxC, minR, maxR };
}
const isSingle = g => g.pieces.length === 1;
const onBoard = g => !isSingle(g) || g.pieces[0].where === 'board';

function groupRect(g){
  const b = g.bbox;
  return { x: g.gx + b.minC * P.pw - P.pad, y: g.gy + b.minR * P.ph - P.pad,
           w: (b.maxC - b.minC + 1) * P.pw + 2 * P.pad, h: (b.maxR - b.minR + 1) * P.ph + 2 * P.pad };
}
function toFront(g){
  const i = items.indexOf(g);
  if (i >= 0){ items.splice(i, 1); items.push(g); }
}
function merge(a, b){
  a.pieces.forEach(p => { p.group = b; b.pieces.push(p); });
  b.pieces.forEach(p => p.where = 'board');
  items.splice(items.indexOf(a), 1);
  updateBBox(b);
  buildGroupImage(b);
  toFront(b);
  return b;
}

/* =====================================================================
   6. Screen areas and the board camera
   ===================================================================== */

let VW = 0, VH = 0, dpr = 1;
let boardR = { x: 0, y: 0, w: 0, h: 0 }, trayR = { x: 0, y: 0, w: 0, h: 0 };
let world = null;   // the board area in picture units: the picture plus a margin
const cache = document.createElement('canvas'), cctx = cache.getContext('2d');

function resizeCanvas(){
  if (!stage.clientWidth || !stage.clientHeight) return;   // game screen hidden
  dpr = Math.min(window.devicePixelRatio || 1, S.sharp ? 2 : 1.25);
  VW = stage.clientWidth; VH = stage.clientHeight;
  for (const c of [view, cache]){ c.width = Math.round(VW * dpr); c.height = Math.round(VH * dpr); }
  view.style.width = VW + 'px'; view.style.height = VH + 'px';
  // Sorting mode: the board folds away and the pieces area takes the whole space.
  const trayH = mode === 'sort' ? VH : Math.round(Math.min(Math.max(VH * 0.34, 150), 380));
  boardR = { x: 0, y: 0, w: VW, h: VH - trayH };
  trayR = { x: 0, y: VH - trayH, w: VW, h: trayH };
  $('done').style.height = boardR.h + 'px';
  if (P){ if (boardR.h > 0) clampCam(); layoutTray(); }
  invalidate();
}

function computeWorld(){
  const M = 1.4 * Math.max(P.pw, P.ph);
  world = { x: -M, y: -M, w: P.W + 2 * M, h: P.H + 2 * M };
}

const inBoard = pt => pt.y < boardR.h;
const inTray = pt => pt.y >= trayR.y && pt.y <= trayR.y + trayR.h;

function fitTarget(){
  const m = 0.35 * Math.max(P.pw, P.ph), w = P.W + 2 * m, h = P.H + 2 * m;
  const s = Math.min(boardR.w / w, boardR.h / h);
  return { s, x: -m + w / 2 - boardR.w / (2 * s), y: -m + h / 2 - boardR.h / (2 * s) };
}
const minScale = () => fitTarget().s * 0.85;
const maxScale = () => Math.min(boardR.w, boardR.h) * 0.45 / Math.min(P.pw, P.ph);

function clampCam(){
  cam.s = Math.min(Math.max(cam.s, minScale()), Math.max(minScale(), maxScale()));
  const vw = boardR.w / cam.s, vh = boardR.h / cam.s;
  const x0 = world.x, x1 = world.x + world.w, y0 = world.y, y1 = world.y + world.h;
  cam.x = vw >= x1 - x0 ? (x0 + x1 - vw) / 2 : Math.min(Math.max(cam.x, x0), x1 - vw);
  cam.y = vh >= y1 - y0 ? (y0 + y1 - vh) / 2 : Math.min(Math.max(cam.y, y0), y1 - vh);
}

const toWorld = (sx, sy) => ({ x: cam.x + sx / cam.s, y: cam.y + sy / cam.s });
function zoomTarget(sx, sy, s){
  const w = toWorld(sx, sy);
  s = Math.min(Math.max(s, minScale()), maxScale());
  return { s, x: w.x - sx / s, y: w.y - sy / s };
}
let camAnim = null;
function animateCam(to){ camAnim = { from: { ...cam }, to, t0: performance.now(), dur: 260 }; invalidate(); }

/* =====================================================================
   7. The pieces area
   ===================================================================== */

const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inPile = id => pieces.filter(p => p.where === id);
const shownPieces = () => inPile(source === 'box' ? 'tray' : source);

// Piece size in the pieces area: as big as the setting allows, smaller if crowded.
function layoutTray(count){
  if (!P) return;
  const n = Math.max(1, count ?? trayList.length);
  const fit = Math.sqrt(trayR.w * trayR.h * 0.95 / (n * P.sw * P.sh));
  const T = Math.min(P.pw, P.ph);
  const most = mode === 'sort' ? S.sortSize : S.traySize;
  trayK = Math.max(34 / T, Math.min(most / T, fit));
  // Keep every piece fully inside the area at the new size.
  const hw = Math.min(.5, (P.pw / 2 + P.tabH + 4) * trayK / trayR.w), hh = Math.min(.5, (P.ph / 2 + P.tabH + 4) * trayK / trayR.h);
  for (const p of trayList){
    if (p.tx == null) continue;
    p.tx = Math.min(Math.max(p.tx, hw), 1 - hw);
    p.ty = Math.min(Math.max(p.ty, hh), 1 - hh);
  }
}

// Top-left corner on screen of a piece's image in the pieces area.
function trayXY(p){
  return { x: trayR.x + p.tx * trayR.w - (P.pad + P.pw / 2) * trayK, y: trayR.y + p.ty * trayR.h - (P.pad + P.ph / 2) * trayK };
}

// Random spots in the pieces area, spread a little so they don't all bury each other.
function scatterTray(list){
  const hw = (P.pw / 2 + P.tabH + 4) * trayK / trayR.w, hh = (P.ph / 2 + P.tabH + 4) * trayK / trayR.h;
  const pts = trayList.filter(p => !list.includes(p) && p.tx != null).map(p => ({ x: p.tx * trayR.w, y: p.ty * trayR.h }));
  for (const p of list){
    let best = null, bd = -1;
    for (let i = 0; i < 4; i++){
      const x = hw + Math.random() * Math.max(0, 1 - 2 * hw), y = hh + Math.random() * Math.max(0, 1 - 2 * hh);
      let d = Infinity;
      for (const q of pts){ const dd = (q.x - x * trayR.w) ** 2 + (q.y - y * trayR.h) ** 2; if (dd < d) d = dd; }
      if (d > bd){ bd = d; best = { x, y }; }
    }
    p.tx = best.x; p.ty = best.y;
    pts.push({ x: best.x * trayR.w, y: best.y * trayR.h });
  }
}

// Bring the list of shown pieces up to date. New arrivals slip in at random depths.
function refreshTray(){
  const now = shownPieces(), nowSet = new Set(now), had = new Set(trayList);
  trayList = trayList.filter(p => nowSet.has(p));
  for (const p of [...selected]) if (!nowSet.has(p)) selected.delete(p);
  const fresh = now.filter(p => !had.has(p));
  const unplaced = fresh.filter(p => p.tx == null);
  trayList = trayList.concat(fresh.filter(p => p.tx != null));
  layoutTray(trayList.length + unplaced.length);   // size pieces for the final count first
  scatterTray(unplaced);
  for (const p of shuffle(unplaced)) trayList.splice(Math.floor(Math.random() * (trayList.length + 1)), 0, p);
  layoutTray();
}

// Keep the box's share of the pieces area topped up.
function feed(exclude){
  const need = S.trayCount - inPile('tray').length;
  if (need <= 0) return 0;
  const add = shuffle(inPile('box').filter(p => !exclude || !exclude.has(p))).slice(0, need);
  add.forEach(p => { p.where = 'tray'; p.tx = null; });
  return add.length;
}

function setSource(id){
  if (source === id) return;
  source = id;
  trayList = [];
  afterChange();
}

// Tap the box while looking at it: put the pieces back and take out a fresh handful.
function mixBox(){
  const out = inPile('tray');
  if (!inPile('box').length){ toast('All the pieces are already out of the box.'); return; }
  out.forEach(p => { p.where = 'box'; p.tx = null; });
  feed();
  trayList = [];
  pulseHeap('box'); chime([440, 494]); buzz(15);
  afterChange();
}

function heapTap(id){
  if (mode === 'sort' && selected.size){ toHeap([...selected], id); return; }
  if (id === 'new') return;
  if (id === 'box' && source === 'box'){ mixBox(); return; }
  setSource(id);
}

function prune(){
  piles = piles.filter(pl => inPile(pl.id).length > 0);
  if (source !== 'box' && !piles.some(pl => pl.id === source)){ source = 'box'; trayList = []; }
}

// Drop pieces onto the box, a pile, or the empty spot (which starts a new pile).
function toHeap(list, id, exclude){
  if (id === 'new'){
    id = 'p' + Date.now() + Math.floor(Math.random() * 1000);
    piles.push({ id, color: PILE_COLORS[pileCount++ % PILE_COLORS.length] });
  }
  list.forEach(p => {
    p.tx = null; selected.delete(p);
    if (id === 'box'){ p.where = 'box'; p.touched = false; }
    else { p.where = id; p.touched = true; }
  });
  if (id === 'box') feed(new Set(list));
  pulseHeap(id); buzz(15); chime([880]);
  afterChange();
  return id;
}

$('edges').addEventListener('click', () => {
  const list = pieces.filter(p => (p.where === 'box' || p.where === 'tray') && isEdge(p));
  if (!list.length){ toast('There are no edge pieces left in the box.'); return; }
  let pl = piles.find(x => x.edges);
  const id = toHeap(list, pl ? pl.id : 'new');
  if (!pl) piles.find(x => x.id === id).edges = true;
  setSource(id);
  toast(`${list.length} edge pieces gathered in a pile.`);
});

/* =====================================================================
   8. The pile shelf
   ===================================================================== */

function drawHeap(cv, list, kind){
  const W = 80, H = 60, d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(d, d);
  if (kind === 'box'){
    ctx.fillStyle = '#A8673F'; ctx.beginPath(); ctx.roundRect(6, 14, 68, 42, 4); ctx.fill();
    ctx.fillStyle = '#C9895C'; ctx.fillRect(6, 14, 68, 9);
    return;
  }
  if (!list.length){
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(W/2, H/2 + 4, 30, 17, 0, 0, Math.PI*2); ctx.fill();
    return;
  }
  const shown = list.slice().sort((a, b) => a.i - b.i).slice(0, Math.min(8, 2 + Math.ceil(list.length / 3)));
  const k = 36 / Math.max(P.pw, P.ph), w = P.sw * k, h = P.sh * k;
  shown.forEach((p, i) => {
    ctx.save();
    ctx.translate(W/2 + p.hx, H/2 + 6 + p.hy * .6 - i * 1.5);
    ctx.rotate(p.hr);
    ctx.drawImage(p.sp.c, p.sp.x, p.sp.y, p.sp.w, p.sp.h, -w/2, -h/2, w, h);
    ctx.restore();
  });
}

function renderDock(){
  const n = selected.size, label = $('dockLabel');
  label.hidden = !(mode === 'sort' && n);
  label.textContent = n ? `Tap a pile to move ${n} piece${n > 1 ? 's' : ''}` : '';
  chipsEl.textContent = '';
  const make = (id, kind, color, count, list, active, label) => {
    const b = document.createElement('button');
    b.className = 'heap'; b.dataset.id = id;
    b.setAttribute('aria-pressed', !!active);
    b.setAttribute('aria-label', label);
    const cv = document.createElement('canvas');
    drawHeap(cv, list, kind);
    const tag = document.createElement('span'); tag.className = 'tag';
    if (color){ const dot = document.createElement('i'); dot.style.background = color; tag.appendChild(dot); }
    tag.appendChild(document.createTextNode(kind === 'new' ? '+' : count));
    b.append(cv, tag);
    b.addEventListener('click', () => heapTap(id));
    chipsEl.appendChild(b);
  };
  const boxCount = inPile('box').length + inPile('tray').length;
  make('box', 'box', null, boxCount, [], source === 'box',
    source === 'box' ? `Puzzle box, ${boxCount} pieces. Tap to mix in new pieces.` : `Puzzle box, ${boxCount} pieces`);
  piles.forEach((pl, i) => {
    const list = inPile(pl.id);
    make(pl.id, 'pile', pl.color, list.length, list, source === pl.id, `Pile ${i + 1}, ${list.length} pieces`);
  });
  make('new', 'new', null, 0, [], false, 'Empty spot: drop a piece here to start a new pile');
}

function pulseHeap(id){
  requestAnimationFrame(() => {
    const c = chipsEl.querySelector(`.heap[data-id="${id}"]`); if (!c) return;
    c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse');
  });
}
function heapAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('#chips .heap[data-id]') : null;
}
function setHover(h){
  const old = chipsEl.querySelector('.heap.target');
  if (old && old !== h) old.classList.remove('target');
  if (h) h.classList.add('target');
}

/* =====================================================================
   9. Drawing
   ===================================================================== */

let drawQueued = false, cacheValid = false;
const effects = [];
function invalidate(){ cacheValid = false; requestDraw(); }
function requestDraw(){ if (!drawQueued){ drawQueued = true; requestAnimationFrame(frame); } }

function readColors(){
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  colors = { table: v('--table'), slot: v('--slot'), tray: v('--tray') };
  invalidate();
}

function worldTransform(ctx){
  ctx.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, -cam.x * cam.s * dpr, -cam.y * cam.s * dpr);
}
function clipBoard(ctx){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.beginPath(); ctx.rect(0, 0, view.width, Math.round(boardR.h * dpr)); ctx.clip();
}

function drawGroup(ctx, g){
  if (isSingle(g)){
    const p = g.pieces[0], sp = p.sp;
    ctx.drawImage(sp.c, sp.x, sp.y, sp.w, sp.h, g.gx + p.c * P.pw - P.pad, g.gy + p.r * P.ph - P.pad, sp.w, sp.h);
  } else ctx.drawImage(g.sp.c, g.gx + g.ox, g.gy + g.oy);
}
function drawTrayPiece(ctx, p, x, y, k){
  const sp = p.sp;
  ctx.drawImage(sp.c, sp.x, sp.y, sp.w, sp.h, x, y, sp.w * k, sp.h * k);
}

function drawScene(ctx, skip){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = colors.table; ctx.fillRect(0, 0, view.width, view.height);
  if (!P) return;

  // Board area
  ctx.save();
  clipBoard(ctx);
  worldTransform(ctx);
  ctx.fillStyle = colors.slot; ctx.fillRect(0, 0, P.W, P.H);
  if (peek){ ctx.globalAlpha = .3; ctx.drawImage(img, 0, 0); ctx.globalAlpha = 1; }
  ctx.drawImage(boardCanvas, 0, 0);
  const vx0 = cam.x, vy0 = cam.y, vx1 = cam.x + boardR.w / cam.s, vy1 = cam.y + boardR.h / cam.s;
  for (const g of items){
    if (g === skip || !onBoard(g)) continue;
    const r = groupRect(g);
    if (r.x > vx1 || r.y > vy1 || r.x + r.w < vx0 || r.y + r.h < vy0) continue;
    drawGroup(ctx, g);
  }
  ctx.restore();

  // Pieces area
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = colors.tray; ctx.fillRect(trayR.x, trayR.y, trayR.w, trayR.h);
  const sh = ctx.createLinearGradient(0, trayR.y, 0, trayR.y + 10);
  sh.addColorStop(0, 'rgba(0,0,0,.28)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh; ctx.fillRect(trayR.x, trayR.y, trayR.w, 10);
  ctx.save();
  ctx.beginPath(); ctx.rect(trayR.x, trayR.y, trayR.w, trayR.h); ctx.clip();
  for (const p of trayList){
    if (p === skip) continue;
    const q = trayXY(p);
    drawTrayPiece(ctx, p, q.x, q.y, trayK);
    if (selected.has(p)){
      ctx.save(); ctx.translate(q.x, q.y); ctx.scale(trayK, trayK);
      ctx.lineWidth = 4 / trayK; ctx.strokeStyle = '#F2C14E'; ctx.stroke(p.path);
      ctx.restore();
    }
  }
  ctx.restore();
  if (!trayList.length){
    ctx.fillStyle = 'rgba(255,248,236,.75)'; ctx.font = '18px "Atkinson Hyperlegible", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(inPile('box').length || source !== 'box' ? 'No pieces here.' : 'No pieces left in the box.', trayR.x + trayR.w / 2, trayR.y + trayR.h / 2);
  }
}

function drawDragged(ctx){
  const d = drag;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 14 * dpr; ctx.shadowOffsetY = 8 * dpr;
  if (d.kind === 'board'){ worldTransform(ctx); drawGroup(ctx, d.item); }
  else {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const k = inBoard(d.last) ? cam.s : trayK;
    const x = d.last.x - d.gu * P.sw * k, y = d.last.y - d.gv * P.sh * k;
    drawTrayPiece(ctx, d.item, x, y, k);
    if (selected.has(d.item)){
      ctx.shadowColor = 'transparent'; ctx.translate(x, y); ctx.scale(k, k);
      ctx.lineWidth = 4 / k; ctx.strokeStyle = '#F2C14E'; ctx.stroke(d.item.path);
    }
  }
  ctx.restore();
}

function frame(now){
  drawQueued = false;
  let more = false;
  if (camAnim){
    const k = Math.min(1, (now - camAnim.t0) / camAnim.dur), e = 1 - Math.pow(1 - k, 3);
    for (const key of ['x', 'y', 's']) cam[key] = camAnim.from[key] + (camAnim.to[key] - camAnim.from[key]) * e;
    cacheValid = false;
    if (k >= 1){ camAnim = null; clampCam(); scheduleSave(); } else more = true;
  }
  // Holding a piece at the edge of the board area scrolls the board.
  if (drag && drag.moved && drag.edge){
    if (now - drag.edgeT > 300){
      const step = 10 / cam.s, bx = cam.x, by = cam.y;
      cam.x += drag.edge.x * step; cam.y += drag.edge.y * step; clampCam();
      const dx = cam.x - bx, dy = cam.y - by;
      if (dx || dy){ if (drag.kind === 'board'){ drag.item.gx += dx; drag.item.gy += dy; } cacheValid = false; }
    }
    more = true;
  }

  if (drag && drag.moved){
    if (!cacheValid){ drawScene(cctx, drag.item); cacheValid = true; }
    vctx.setTransform(1, 0, 0, 1, 0, 0);
    vctx.drawImage(cache, 0, 0);
  } else drawScene(vctx, null);

  if (effects.length){
    vctx.save(); clipBoard(vctx); worldTransform(vctx);
    for (let i = effects.length - 1; i >= 0; i--){
      const fx = effects[i], k = (now - fx.t0) / 700;
      if (k >= 1){ effects.splice(i, 1); continue; }
      vctx.strokeStyle = `rgba(242,193,78,${1 - k})`;
      vctx.lineWidth = (3 + 6 * (1 - k)) / cam.s;
      for (const p of fx.pieces){
        vctx.save(); vctx.translate(fx.gx + p.c * P.pw - P.pad, fx.gy + p.r * P.ph - P.pad); vctx.stroke(p.path); vctx.restore();
      }
      more = true;
    }
    vctx.restore();
  }
  if (drag && drag.moved) drawDragged(vctx);
  if (more) requestDraw();
}

/* =====================================================================
   10. Feedback
   ===================================================================== */

let actx = null;
function ensureAudio(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function chime(notes){
  if (!actx || !S.sound) return;
  notes.forEach((f, i) => {
    const t = actx.currentTime + i * 0.09;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(gn).connect(actx.destination);
    o.start(t); o.stop(t + 0.35);
  });
}
function buzz(pattern){ if (S.vibrate && navigator.vibrate) navigator.vibrate(pattern); }
function glow(g){ if (S.glow){ effects.push({ gx: g.gx, gy: g.gy, pieces: g.pieces.slice(), t0: performance.now() }); requestDraw(); } }

function toast(text){
  const t = document.body.dataset.screen === 'home' ? $('homeToast') : $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const pointers = new Map();
let drag = null, pan = null, pinch = null, lastTap = { t: 0, x: 0, y: 0 };
const local = e => { const r = view.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

function hitGroup(g, wx, wy, tol){
  const r = groupRect(g);
  if (wx < r.x - tol || wy < r.y - tol || wx > r.x + r.w + tol || wy > r.y + r.h + tol) return false;
  for (const p of g.pieces){
    const lx = wx - (g.gx + p.c * P.pw - P.pad), ly = wy - (g.gy + p.r * P.ph - P.pad);
    if (tol){ if (lx > P.pad - tol && ly > P.pad - tol && lx < P.pad + P.pw + tol && ly < P.pad + P.ph + tol) return true; }
    else if (hitCtx.isPointInPath(p.path, lx, ly)) return true;
  }
  return false;
}
function pickBoard(pt){
  const w = toWorld(pt.x, pt.y);
  for (const tol of [0, 14 / cam.s]){
    for (let i = items.length - 1; i >= 0; i--){
      const g = items[i];
      if (onBoard(g) && hitGroup(g, w.x, w.y, tol)) return g;
    }
  }
  return null;
}
// Returns the piece and where on its image you grabbed it (0..1 across the sprite).
function pickTray(pt){
  for (const tol of [0, 14]){
    for (let i = trayList.length - 1; i >= 0; i--){
      const p = trayList[i], q = trayXY(p);
      const lx = (pt.x - q.x) / trayK, ly = (pt.y - q.y) / trayK;
      let hit;
      if (tol){ const t = tol / trayK; hit = lx > P.pad - t && ly > P.pad - t && lx < P.pad + P.pw + t && ly < P.pad + P.ph + t; }
      else hit = lx >= 0 && ly >= 0 && lx <= P.sw && ly <= P.sh && hitCtx.isPointInPath(p.path, lx, ly);
      if (hit) return { p, gu: lx / P.sw, gv: ly / P.sh };
    }
  }
  return null;
}

view.addEventListener('contextmenu', e => e.preventDefault());

view.addEventListener('pointerdown', e => {
  ensureAudio();
  if (!P) return;
  view.setPointerCapture(e.pointerId);
  const pt = local(e);
  pointers.set(e.pointerId, pt);

  if (pointers.size === 2){
    if (drag && drag.kind === 'tray') return;  // keep dragging; ignore the extra finger
    const pts = [...pointers.values()];
    if (!pts.every(inBoard)) return;
    if (drag){ if (drag.moved){ drag.item.gx = drag.ox; drag.item.gy = drag.oy; } drag = null; setHover(null); }
    pan = null; camAnim = null;
    const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    pinch = { d0: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1, s0: cam.s, w: toWorld(mid.x, mid.y) };
    invalidate();
    return;
  }
  if (pointers.size !== 1) return;

  if (inBoard(pt)){
    const g = pickBoard(pt);
    if (g){ drag = { kind: 'board', item: g, id: e.pointerId, start: pt, last: pt, moved: false, ox: g.gx, oy: g.gy }; toFront(g); }
    else { camAnim = null; pan = { id: e.pointerId, last: pt, start: pt, moved: false }; }
  } else if (inTray(pt)){
    const hit = pickTray(pt);
    if (hit){
      drag = { kind: 'tray', item: hit.p, id: e.pointerId, start: pt, last: pt, moved: false, gu: hit.gu, gv: hit.gv };
      trayList.splice(trayList.indexOf(hit.p), 1); trayList.push(hit.p);
    }
  }
});

view.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const pt = local(e);
  pointers.set(e.pointerId, pt);

  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    cam.s = Math.min(Math.max(pinch.s0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0, minScale()), maxScale());
    cam.x = pinch.w.x - mid.x / cam.s; cam.y = pinch.w.y - mid.y / cam.s;
    clampCam(); invalidate();
    return;
  }

  if (drag && drag.id === e.pointerId){
    if (!drag.moved){
      if (Math.hypot(pt.x - drag.start.x, pt.y - drag.start.y) < 7) return;
      drag.moved = true; cacheValid = false;
    }
    if (drag.kind === 'board'){
      const g = drag.item;
      g.gx += (pt.x - drag.last.x) / cam.s; g.gy += (pt.y - drag.last.y) / cam.s;
    }
    drag.last = pt;
    const E = 36, wasEdge = !!drag.edge;
    drag.edge = inBoard(pt) ? { x: pt.x < E ? -1 : pt.x > VW - E ? 1 : 0, y: pt.y < E ? -1 : 0 } : null;
    if (drag.edge && !drag.edge.x && !drag.edge.y) drag.edge = null;
    if (drag.edge && !wasEdge) drag.edgeT = performance.now();
    const single = drag.kind === 'tray' || isSingle(drag.item);
    setHover(single ? heapAt(e.clientX, e.clientY) : null);
    requestDraw();
    return;
  }

  if (pan && pan.id === e.pointerId){
    if (!pan.moved && Math.hypot(pt.x - pan.start.x, pt.y - pan.start.y) < 7) return;
    pan.moved = true;
    cam.x -= (pt.x - pan.last.x) / cam.s; cam.y -= (pt.y - pan.last.y) / cam.s;
    pan.last = pt;
    clampCam(); invalidate();
  }
});

function pointerEnd(e){
  if (!pointers.has(e.pointerId)) return;
  const pt = local(e);
  pointers.delete(e.pointerId);
  if (pinch){
    if (pointers.size < 2){
      pinch = null;
      if (pointers.size === 1){ const [id, p] = [...pointers.entries()][0]; pan = { id, last: p, start: p, moved: true }; }
      scheduleSave();
    }
    return;
  }
  if (drag && drag.id === e.pointerId){
    const d = drag; drag = null; setHover(null); cacheValid = false;
    if (!d.moved || e.type === 'pointercancel'){
      if (d.kind === 'board' && d.moved){ d.item.gx = d.ox; d.item.gy = d.oy; }
      if (!d.moved && e.type === 'pointerup' && d.kind === 'tray' && mode === 'sort'){
        if (selected.has(d.item)) selected.delete(d.item); else selected.add(d.item);
        renderDock();
      }
      invalidate(); return;
    }
    if (d.kind === 'tray') dropFromTray(d, pt, e); else dropFromBoard(d, pt, e);
    return;
  }
  if (pan && pan.id === e.pointerId){
    if (!pan.moved && e.type === 'pointerup') handleTap(pt);
    pan = null; scheduleSave();
  }
}
view.addEventListener('pointerup', pointerEnd);
view.addEventListener('pointercancel', pointerEnd);

view.addEventListener('wheel', e => {
  if (!P) return;
  const pt = local(e);
  if (!inBoard(pt)) return;
  e.preventDefault();
  Object.assign(cam, zoomTarget(pt.x, pt.y, cam.s * Math.exp(-e.deltaY * 0.0015)));
  clampCam(); invalidate(); scheduleSave();
}, { passive: false });

function handleTap(pt){
  const now = performance.now();
  if (now - lastTap.t < 320 && Math.hypot(pt.x - lastTap.x, pt.y - lastTap.y) < 30){
    lastTap.t = 0;
    const fit = fitTarget();
    animateCam(cam.s > fit.s * 1.8 ? fit : zoomTarget(pt.x, pt.y, cam.s * 2.5));
  } else lastTap = { t: now, x: pt.x, y: pt.y };
}

// Place the centre of a piece in the pieces area at a screen point.
function putInTray(p, cx, cy){
  p.tx = Math.min(Math.max((cx - trayR.x) / trayR.w, 0.02), 0.98);
  p.ty = Math.min(Math.max((cy - trayR.y) / trayR.h, 0.05), 0.95);
}

function dropFromTray(d, pt, e){
  const p = d.item, heap = heapAt(e.clientX, e.clientY);
  if (heap){ toHeap(mode === 'sort' && selected.has(p) ? [...selected] : [p], heap.dataset.id); return; }
  if (inBoard(pt)){
    const w = toWorld(pt.x, pt.y), g = p.group;
    g.gx = w.x - d.gu * P.sw - (p.c * P.pw - P.pad);
    g.gy = w.y - d.gv * P.sh - (p.r * P.ph - P.pad);
    p.where = 'board'; p.touched = true; p.tx = null;
    toFront(g);
    settleOnBoard(g);
    return;
  }
  // Moved around inside the pieces area.
  const k = trayK;
  putInTray(p, pt.x - d.gu * P.sw * k + (P.pad + P.pw / 2) * k, pt.y - d.gv * P.sh * k + (P.pad + P.ph / 2) * k);
  p.touched = true;
  afterChange();
}

function dropFromBoard(d, pt, e){
  const g = d.item, heap = heapAt(e.clientX, e.clientY);
  if (isSingle(g) && heap){ toHeap([g.pieces[0]], heap.dataset.id); return; }
  if (!inBoard(pt)){
    if (isSingle(g) && inTray(pt)){
      const p = g.pieces[0];
      p.where = source === 'box' ? 'tray' : source;
      putInTray(p, pt.x, pt.y);
      trayList.push(p);
      afterChange();
    } else { g.gx = d.ox; g.gy = d.oy; invalidate(); }  // joined pieces stay on the board
    return;
  }
  settleOnBoard(g);
}

// After a drop on the board: lock into place, or join neighbours, or just lie there.
function settleOnBoard(g){
  const r = groupRect(g), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  g.gx += Math.min(Math.max(cx, world.x), world.x + world.w) - cx;
  g.gy += Math.min(Math.max(cy, world.y), world.y + world.h) - cy;
  const T = Math.min(P.pw, P.ph);
  const snapFrame = Math.max(6, T * S.snapFrame / 100), snapJoin = Math.max(6, T * S.snapJoin / 100);

  if (Math.hypot(g.gx, g.gy) < snapFrame){
    g.gx = 0; g.gy = 0;
    g.pieces.forEach(p => { p.placed = true; p.where = 'placed'; });
    paintPlaced(g.pieces);
    items.splice(items.indexOf(g), 1);
    glow(g); buzz([20, 40, 20]); chime([523.25, 783.99]);
    if (pieces.every(p => p.placed)) setTimeout(() => chime([523.25, 659.25, 783.99, 1046.5]), 250);
    afterChange();
    return;
  }
  let joined = false, again = true;
  while (again){
    again = false;
    outer: for (const p of g.pieces){
      for (const [dr, dc] of DIRS){
        const n = at(p.r + dr, p.c + dc);
        if (!n || n.placed || n.group === g || !onBoard(n.group)) continue;
        if (Math.hypot(g.gx - n.group.gx, g.gy - n.group.gy) < snapJoin){
          g = merge(g, n.group); joined = again = true; break outer;
        }
      }
    }
  }
  if (joined){ glow(g); buzz(25); chime([659.25]); }
  afterChange();
}

const store = {
  db: null,
  async open(){
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('jigsaw', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k){ const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
};

let saveTimer = null;
let current = null;        // the catalogue entry being played
let progress = {};         // id -> { pct, done, count }
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 600); }
function snapshot(){
  const r2 = v => Math.round(v * 100) / 100, r3 = v => v == null ? null : Math.round(v * 1000) / 1000;
  return {
    v: 4, seed: P.seed, count: P.count, cols: P.cols, rows: P.rows, W: P.W, H: P.H,
    groups: items.filter(onBoard).map(g => ({ i: g.pieces.map(p => p.i), x: r2(g.gx), y: r2(g.gy) })),
    where: pieces.map(p => p.where),
    tray: pieces.map(p => p.tx == null ? null : [r3(p.tx), r3(p.ty)]),
    touched: pieces.filter(p => p.touched).map(p => p.i),
    piles, pileCount, source,
    cam: { x: r2(cam.x), y: r2(cam.y), s: cam.s },
  };
}
async function saveState(){
  clearTimeout(saveTimer);
  if (!P || !current) return;
  const placed = pieces.filter(p => p.placed).length;
  progress[current.id] = { pct: Math.floor(placed / pieces.length * 100), done: placed === pieces.length, count: P.count };
  try {
    await store.set('state:' + current.id, snapshot());
    await store.set('progress', progress);
  } catch (e) { console.warn('Could not save', e); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);

// Load a saved puzzle. The picture is redrawn at exactly the saved size,
// so every saved piece position still lines up.
async function restore(entry){
  const st = await store.get('state:' + entry.id);
  if (!st || st.v !== 4) return false;
  const bmp = await loadBitmap(entry);
  img = document.createElement('canvas'); img.width = st.W; img.height = st.H;
  img.getContext('2d').drawImage(bmp, 0, 0, st.W, st.H);
  if (bmp.close) bmp.close();
  makePuzzle(st.seed, st.count, st.cols, st.rows);
  pieces.forEach(p => {
    p.where = st.where[p.i]; p.placed = p.where === 'placed';
    const t = st.tray[p.i]; p.tx = t ? t[0] : null; p.ty = t ? t[1] : null;
  });
  st.touched.forEach(i => pieces[i].touched = true);
  const inGroup = new Set();
  items = st.groups.map(gr => { gr.i.forEach(i => inGroup.add(i)); return makeGroup(gr.i.map(i => pieces[i]), gr.x, gr.y); });
  pieces.forEach(p => { if (!p.placed && !inGroup.has(p.i)) items.push(makeGroup([p], 0, 0)); });
  piles = st.piles || []; pileCount = st.pileCount || 0; source = st.source || 'box';
  trayList = []; effects.length = 0;
  if (mode !== 'puzzle') setMode('puzzle', true);
  rebuildGraphics();
  cam = { ...st.cam };
  clampCam();
  afterChange();
  return true;
}

function prepareImage(src){
  const max = S.sharp ? 2048 : 1600;
  const k = Math.min(1, max / Math.max(src.width, src.height));
  const c = document.createElement('canvas');
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c;
}
async function newPuzzle(picture, count){
  img = prepareImage(picture);
  const seed = (Math.random() * 4294967296) >>> 0;
  const { cols, rows } = gridFor(count, img.width / img.height);
  makePuzzle(seed, count, cols, rows);
  pieces.forEach(p => p.tx = null);
  items = pieces.map(p => makeGroup([p], 0, 0));
  piles = []; pileCount = 0; source = 'box'; trayList = []; effects.length = 0;
  if (mode !== 'puzzle') setMode('puzzle', true);
  peek = false; $('peek').setAttribute('aria-pressed', 'false');
  rebuildGraphics();
  Object.assign(cam, fitTarget());
  afterChange();
}

// puzzles.json lists the pictures by category:
//   { "Landscapes": ["01 Lakeside village.jpg", ...], "Patterns": [...] }
// Each picture lives in puzzles/<category>/<file>. Names come from the file
// names: a number at the start only sets the order, and is hidden.
const PHOTOS = 'My photos';
let catalog = [], catFilter = 'All';
let seen = null;             // ids of puzzles she has already been shown, for the "New" badge
const niceName = f => f.replace(/\.[^.]+$/, '').replace(/^\d+[\s._-]*/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim() || f;

async function loadCatalog(){
  let list = null, files = null, msg = '';
  try {
    const r = await fetch('puzzles.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok){
      const text = await r.text();
      try { list = JSON.parse(text); } catch (e) { msg = 'The puzzle list (puzzles.json) has a mistake in it, so only your own photos are shown.'; }
    }
  } catch (e) {}
  if (!list && !msg && window.EMBEDDED){ list = window.EMBEDDED.list; files = window.EMBEDDED.files; }
  if (!list && !msg) msg = 'No puzzle list found. Add a puzzles.json file next to index.html.';
  const out = [];
  if (list && typeof list === 'object'){
    for (const [cat, names] of Object.entries(list)){
      if (!Array.isArray(names)) continue;
      for (const f of names){
        if (typeof f !== 'string' || !f.trim()) continue;
        const path = `puzzles/${cat}/${f}`;
        out.push({ id: 'cat:' + path, name: niceName(f), category: cat,
                   url: files ? files[path] : path.split('/').map(encodeURIComponent).join('/') });
      }
    }
  }
  let photos = [];
  try { photos = (await store.get('photos')) || []; } catch (e) {}
  photos.forEach(ph => out.push({ id: ph.id, name: ph.name, category: PHOTOS, photo: true }));
  catalog = out;
  const m = $('homeMsg'); m.hidden = !msg; m.textContent = msg;
}

async function loadBitmap(entry){
  let blob;
  if (entry.photo) blob = await store.get('image:' + entry.id);
  else { const r = await fetch(entry.url); if (!r.ok) throw new Error('missing'); blob = await r.blob(); }
  if (!blob) throw new Error('missing');
  return createImageBitmap(blob);
}

// Thumbnails: made once from the full picture, then kept on the device.
const thumbURL = {}, thumbFailed = new Set(), thumbQueue = [];
let thumbBusy = 0;
function applyThumb(id){
  document.querySelectorAll('.card[data-id]').forEach(card => {
    if (card.dataset.id !== id) return;
    if (thumbURL[id]) card.querySelector('.thumb').style.backgroundImage = `url("${thumbURL[id]}")`;
    card.classList.toggle('broken', thumbFailed.has(id));
    if (thumbFailed.has(id)) card.querySelector('.name').textContent = 'Couldn’t load this picture';
  });
}
function wantThumb(entry){
  if (thumbURL[entry.id] || thumbFailed.has(entry.id)){ applyThumb(entry.id); return; }
  if (!thumbQueue.includes(entry)) thumbQueue.push(entry);
  pumpThumbs();
}
function pumpThumbs(){
  while (thumbBusy < 2 && thumbQueue.length){
    const entry = thumbQueue.shift();
    thumbBusy++;
    makeThumb(entry).then(url => {
      if (url) thumbURL[entry.id] = url; else thumbFailed.add(entry.id);
      applyThumb(entry.id);
    }).finally(() => { thumbBusy--; pumpThumbs(); });
  }
}
async function makeThumb(entry){
  try {
    let blob = await store.get('thumb:' + entry.id);
    if (!blob){
      const bmp = await loadBitmap(entry);
      const k = Math.min(1, 480 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (bmp.close) bmp.close();
      blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
      await store.set('thumb:' + entry.id, blob);
    }
    return URL.createObjectURL(blob);
  } catch (e) { return null; }
}

function renderHome(){
  const cats = ['All', ...new Set(catalog.map(e => e.category))];
  if (!cats.includes(catFilter)) catFilter = 'All';
  const nav = $('cats'); nav.textContent = '';
  const isNew = e => !e.photo && seen && !seen.has(e.id);
  cats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c; b.setAttribute('aria-pressed', c === catFilter);
    if (catalog.some(e => isNew(e) && (c === 'All' || e.category === c))) b.classList.add('hasnew');
    b.addEventListener('click', () => { catFilter = c; renderHome(); $('gridWrap').scrollTop = 0; });
    nav.appendChild(b);
  });
  const grid = $('grid'); grid.textContent = '';
  if (catFilter === 'All' || catFilter === PHOTOS){
    const add = document.createElement('button');
    add.className = 'card add';
    add.innerHTML = '<span class="thumb" aria-hidden="true">+</span><span class="name">Your own photo</span>';
    add.addEventListener('click', () => $('file').click());
    grid.appendChild(add);
  }
  for (const entry of catalog){
    if (catFilter !== 'All' && entry.category !== catFilter) continue;
    const card = document.createElement('button');
    card.className = 'card'; card.dataset.id = entry.id;
    const thumb = document.createElement('span'); thumb.className = 'thumb';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = entry.name;
    card.append(thumb, name);
    const pr = progress[entry.id];
    if (pr){
      const badge = document.createElement('span'); badge.className = 'badge';
      badge.textContent = pr.done ? 'Done' : `${pr.pct}%`;
      card.appendChild(badge);
    }
    if (isNew(entry)){
      const tag = document.createElement('span'); tag.className = 'new'; tag.textContent = 'New';
      card.appendChild(tag);
    }
    card.setAttribute('aria-label', entry.name + (isNew(entry) ? ', new' : '') + (pr ? (pr.done ? ', finished' : `, ${pr.pct}% done`) : ''));
    card.addEventListener('click', () => {
      if (thumbFailed.has(entry.id)){ toast('That picture couldn’t be loaded.'); return; }
      openPick(entry);
    });
    grid.appendChild(card);
    wantThumb(entry);
  }
}

// Choosing a puzzle: continue it, or pick how many pieces.
const pickDlg = $('pick');
let picking = null;
function openPick(entry){
  picking = entry;
  if (seen && !seen.has(entry.id)){ seen.add(entry.id); store.set('seen', [...seen]).catch(() => {}); renderHome(); }
  const pr = progress[entry.id], inProgress = pr && !pr.done;
  $('pickImg').src = thumbURL[entry.id] || '';
  $('pickName').textContent = entry.name;
  $('pickResume').hidden = !inProgress;
  if (inProgress) $('pickContinue').textContent = `Continue (${pr.pct}% done, ${pr.count} pieces)`;
  $('pickLabel').textContent = inProgress ? 'Or start over with:' : 'How many pieces?';
  document.querySelectorAll('#pickCounts button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === S.lastCount));
  pickDlg.showModal();
}
$('pickCancel').addEventListener('click', () => pickDlg.close());
$('pickContinue').addEventListener('click', () => { pickDlg.close(); playPuzzle(picking, null); });
document.querySelectorAll('#pickCounts button').forEach(b => b.addEventListener('click', () => {
  const pr = progress[picking.id];
  if (pr && !pr.done && !confirm('Start over? Your progress on this puzzle will be lost.')) return;
  S.lastCount = +b.dataset.n; saveSettings();
  pickDlg.close();
  playPuzzle(picking, S.lastCount);
}));

const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

// count = null means continue the saved puzzle.
async function playPuzzle(entry, count){
  document.body.dataset.screen = 'game';
  await nextFrame();
  resizeCanvas();
  current = entry;
  try {
    if (count === null && await restore(entry)) return;
    const bmp = await loadBitmap(entry);
    await newPuzzle(bmp, count || S.lastCount);
    if (bmp.close) bmp.close();
    saveState();
  } catch (e) {
    console.warn(e);
    toast('That picture couldn’t be loaded.');
    goHome();
  }
}

async function goHome(){
  await saveState();
  document.body.dataset.screen = 'home';
  renderHome();
  refreshCatalog(false);
}

// Look for new puzzles. Quietly when the app comes back to the screen,
// or with a message when she taps the refresh button.
let lastCheck = 0, checking = false;
async function refreshCatalog(loud){
  if (checking || (!loud && Date.now() - lastCheck < 30000)) return;
  checking = true; lastCheck = Date.now();
  const btn = $('refresh'); if (loud) btn.classList.add('spin');
  const before = new Set(catalog.map(e => e.id));
  try { await loadCatalog(); } catch (e) {}
  const added = catalog.filter(e => !before.has(e.id) && !e.photo).length;
  if (document.body.dataset.screen === 'home') renderHome();
  btn.classList.remove('spin');
  checking = false;
  if (loud){
    if (!navigator.onLine) toast('No internet connection right now, so new puzzles can’t be checked.');
    else toast(added ? `${added} new puzzle${added > 1 ? 's' : ''}!` : 'No new puzzles right now.');
  }
}
$('refresh').addEventListener('click', () => refreshCatalog(true));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && document.body.dataset.screen === 'home') refreshCatalog(false);
});
$('back').addEventListener('click', goHome);
$('doneHome').addEventListener('click', goHome);

// Your own photo: kept on this device under "My photos".
$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const bmp = await createImageBitmap(f);
    const c = prepareImage(bmp);
    if (bmp.close) bmp.close();
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.9));
    const id = 'photo:' + Date.now();
    const entry = { id, name: niceName(f.name) || 'Photo', category: PHOTOS, photo: true };
    await store.set('image:' + id, blob);
    const photos = (await store.get('photos')) || [];
    photos.push({ id, name: entry.name });
    await store.set('photos', photos);
    catalog.push(entry);
    renderHome();
    openPick(entry);
  } catch (err) { toast('That picture couldn’t be opened.'); }
});

/* =====================================================================
   17. Start
   ===================================================================== */

(async () => {
  readColors();
  buildSettingsUI();
  try { progress = (await store.get('progress')) || {}; } catch (e) {}
  await loadCatalog();
  let saved = null;
  try { saved = await store.get('seen'); } catch (e) {}
  if (saved) seen = new Set(saved);
  else {   // first time: nothing is "new" yet
    seen = new Set(catalog.map(e => e.id));
    store.set('seen', [...seen]).catch(() => {});
  }
  lastCheck = Date.now();
  renderHome();
})();

if ('serviceWorker' in navigator && location.protocol === 'https:' && !location.hostname.endsWith('claude.ai')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Offline mode unavailable:', err));
  });
}
